name: Story Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run critical story tests
      run: npm run test:critical
      env:
        CI: true
    
    - name: Run all story tests
      run: npm test
      continue-on-error: true # Don't fail on non-critical tests
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.node-version }}
        path: test-results/
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/story-report.json', 'utf8'));
          
          const { total, passed, failed } = report.summary;
          const passRate = Math.round((passed / total) * 100);
          
          let comment = `## 🧪 Story Test Results\n\n`;
          comment += `- **Total Stories**: ${total}\n`;
          comment += `- **Passed**: ${passed} ✅\n`;
          comment += `- **Failed**: ${failed} ❌\n`;
          comment += `- **Pass Rate**: ${passRate}%\n\n`;
          
          if (report.details.blocked.length > 0) {
            comment += `### ⛔ Critical Failures\n`;
            report.details.blocked.forEach(story => {
              comment += `- ${story.title}\n`;
            });
            comment += `\n`;
          }
          
          if (report.details.warnings.length > 0) {
            comment += `### ⚠️ Non-Critical Failures\n`;
            report.details.warnings.forEach(story => {
              comment += `- ${story.title}\n`;
            });
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Fail if critical tests failed
      if: failure()
      run: |
        echo "❌ Critical story tests failed!"
        exit 1