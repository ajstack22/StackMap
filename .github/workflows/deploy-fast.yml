name: Fast Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run basic checks (no npm install)
      run: |
        echo "🚀 Running quick deployment checks..."
        echo "Checking critical files..."
        
        # Check that critical files exist
        for file in index.html sw.js manifest.json state.js app/StackMapApp.js; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        echo "All critical files present!"

  deploy-qual:
    needs: quick-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Qual via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/qual/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/test/**
          **/docs/**
          **/documentation/**
          **/scripts/**
          **/*.test.js
          **/*.spec.js
          **/coverage/**
          **/.env*
          **/README.md
          **/DEVELOPMENT_PLAN.md
          **/package-lock.json
          **/yarn.lock
          **/.DS_Store
          **/Thumbs.db
          **/.well-known/**

  deploy-prod:
    needs: deploy-qual
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/test/**
          **/docs/**
          **/documentation/**
          **/scripts/**
          **/*.test.js
          **/*.spec.js
          **/coverage/**
          **/.env*
          **/README.md
          **/DEVELOPMENT_PLAN.md
          **/package-lock.json
          **/yarn.lock
          **/.DS_Store
          **/Thumbs.db
          **/.well-known/**
          **/qual/**
        dangerous-clean-slate: false