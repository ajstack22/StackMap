name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run pre-deployment checks
      run: bash scripts/pre-deploy-check.sh
    
    - name: Run UAT tests
      run: npm test

  deploy-qual:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Qual via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.CPANEL_SSH_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        script: |
          cd ~/public_html/qual
          git pull origin main
          echo "Deployment to qual completed at $(date)" > ~/deployment-logs/qual-deploy.log
          
  test-qual:
    needs: deploy-qual
    runs-on: ubuntu-latest
    
    steps:
    - name: Wait for deployment to complete
      run: sleep 30
      
    - name: Test Qual Environment
      run: |
        echo "Qual deployment completed"
        echo "Note: Qual environment may not be web-accessible due to server configuration"
        echo "Manual verification required before production deployment"

  manual-verification:
    needs: test-qual
    runs-on: ubuntu-latest
    environment: staging-verification
    
    steps:
    - name: Request Manual Verification
      run: |
        echo "🔍 MANUAL VERIFICATION REQUIRED"
        echo "================================"
        echo ""
        echo "Please verify the staging deployment:"
        echo "1. SSH to server: ssh stackmap-cpanel"
        echo "2. Check files: cd ~/public_html/staging && ls -la"
        echo "3. Test locally if web access unavailable"
        echo "4. Verify the specific issue/feature is fixed"
        echo ""
        echo "For code that cannot be tested on staging:"
        echo "- Review the code changes carefully"
        echo "- Ensure tests pass locally"
        echo "- Document why staging test was skipped"
        echo ""
        echo "Click 'Review deployments' above and approve when ready."

  deploy-prod:
    needs: manual-verification
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.CPANEL_SSH_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        script: |
          # Create deployment log directory if it doesn't exist
          mkdir -p ~/deployment-logs
          
          # Deploy from qual to production
          rsync -av --delete ~/public_html/qual/ ~/public_html/
          
          # Log deployment
          echo "Production deployment completed at $(date)" > ~/deployment-logs/prod-deploy.log
          
          # Clear any caches
          rm -rf ~/public_html/cache/* 2>/dev/null || true

  verify-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    
    steps:
    - name: Verify Production Deployment
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" https://stackmap.app)
        if [ $response -eq 200 ]; then
          echo "Production deployment successful"
        else
          echo "Production returned $response"
          exit 1
        fi