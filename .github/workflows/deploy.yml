name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run pre-deployment checks
      run: bash scripts/pre-deploy-check.sh
    
    - name: Run UAT tests
      run: npm test

  deploy-qual:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Qual via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.CPANEL_SSH_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        script: |
          cd ~/qual
          git pull origin main
          echo "Deployment to qual completed at $(date)" > ~/deployment-logs/qual-deploy.log
          
  test-qual:
    needs: deploy-qual
    runs-on: ubuntu-latest
    
    steps:
    - name: Wait for deployment to complete
      run: sleep 30
      
    - name: Test Qual Environment
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" https://stackmap.app/qual/)
        if [ $response -eq 200 ]; then
          echo "Qual environment is accessible"
        else
          echo "Qual environment returned $response"
          exit 1
        fi

  deploy-prod:
    needs: test-qual
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.CPANEL_HOST }}
        username: ${{ secrets.CPANEL_USER }}
        key: ${{ secrets.CPANEL_SSH_KEY }}
        port: ${{ secrets.CPANEL_PORT }}
        script: |
          # Create deployment log directory if it doesn't exist
          mkdir -p ~/deployment-logs
          
          # Deploy from qual to production
          rsync -av --delete ~/qual/ ~/public_html/
          
          # Log deployment
          echo "Production deployment completed at $(date)" > ~/deployment-logs/prod-deploy.log
          
          # Clear any caches
          rm -rf ~/public_html/cache/* 2>/dev/null || true

  verify-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    
    steps:
    - name: Verify Production Deployment
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" https://stackmap.app)
        if [ $response -eq 200 ]; then
          echo "Production deployment successful"
        else
          echo "Production returned $response"
          exit 1
        fi