name: Auto Deploy to CPanel
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to CPanel
        uses: pinkasey/cpanel-deploy-action@v1.2.1
        with:
          hostname: 'https://stackmap.app:2083'  # CPanel API port
          repository_root: '/home/stachblx/repositories/stackmap'  # Your repo path in CPanel
          branch: main
          cpanel_token: '${{ secrets.CPANEL_TOKEN }}'
          cpanel_username: 'stachblx'  # Your CPanel username
