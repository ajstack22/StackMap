name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        default: ''

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare clean deployment package
      run: |
        echo "📦 Preparing clean deployment package for PRODUCTION..."
        
        # Create a clean deployment directory with ONLY the files we want
        mkdir -p deploy-package
        
        # Copy only the essential app files
        cp -r index.html deploy-package/
        cp -r manifest.json deploy-package/
        cp -r sw.js deploy-package/
        cp -r .htaccess deploy-package/
        cp -r *.png deploy-package/ 2>/dev/null || true
        
        # Copy src directory (new architecture)
        mkdir -p deploy-package/src
        cp -r src/stackmap.js deploy-package/src/
        cp -r src/stackmap.css deploy-package/src/
        cp -r src/CelebrationManager.js deploy-package/src/
        
        echo "📊 Deployment package created:"
        echo "Files: $(find deploy-package -type f | wc -l)"
        echo "Size: $(du -sh deploy-package | cut -f1)"
    
    - name: Deploy to Production
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/
        local-dir: ./deploy-package/
        dangerous-clean-slate: true
        exclude: |
          **/qual/**
          **/.well-known/**
          **/.htaccess
          **/cgi-bin/**
          **/.cpanel/**
          **/tmp/**
          **/etc/**
          **/mail/**
          **/public_ftp/**
          **/ssl/**
          
    - name: Success
      run: |
        echo "✅ Successfully deployed to PRODUCTION!"
        echo "🌐 Live at: https://stackmap.app/"
        echo "📅 Deployed at: $(date)"