name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Generate Changelog
        id: changelog
        uses: actions/github-script@v6
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            
            const previousTag = releases.length > 0 ? releases[0].tag_name : '';
            const currentTag = context.ref.replace('refs/tags/', '');
            
            const { data: commits } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: previousTag || 'HEAD~20',
              head: currentTag
            });
            
            let changelog = '## What\'s Changed\n\n';
            
            const features = [];
            const fixes = [];
            const other = [];
            
            for (const commit of commits.commits) {
              const message = commit.commit.message.split('\n')[0];
              if (message.startsWith('feat:') || message.includes('Add') || message.includes('Implement')) {
                features.push(`- ${message} (${commit.sha.substring(0, 7)})`);
              } else if (message.startsWith('fix:') || message.includes('Fix')) {
                fixes.push(`- ${message} (${commit.sha.substring(0, 7)})`);
              } else {
                other.push(`- ${message} (${commit.sha.substring(0, 7)})`);
              }
            }
            
            if (features.length > 0) {
              changelog += '### 🚀 Features\n' + features.join('\n') + '\n\n';
            }
            if (fixes.length > 0) {
              changelog += '### 🐛 Bug Fixes\n' + fixes.join('\n') + '\n\n';
            }
            if (other.length > 0) {
              changelog += '### 🔧 Other Changes\n' + other.join('\n') + '\n\n';
            }
            
            return changelog;
            
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: ${{ steps.changelog.outputs.result }}
          draft: false
          prerelease: false