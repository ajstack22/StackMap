name: Migrate to FTP Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "MIGRATE" to confirm migration from SSH to FTP'
        required: true
        default: ''

jobs:
  validate-and-migrate:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'MIGRATE'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Validate FTP Secrets
      run: |
        echo "🔍 Checking required secrets..."
        
        MISSING_SECRETS=""
        
        if [ -z "${{ secrets.FTP_SERVER }}" ]; then
          MISSING_SECRETS="${MISSING_SECRETS}FTP_SERVER "
        fi
        
        if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
          MISSING_SECRETS="${MISSING_SECRETS}FTP_USERNAME "
        fi
        
        if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
          MISSING_SECRETS="${MISSING_SECRETS}FTP_PASSWORD "
        fi
        
        if [ -n "$MISSING_SECRETS" ]; then
          echo "❌ Missing required secrets: $MISSING_SECRETS"
          echo "Please add these secrets before running migration"
          exit 1
        fi
        
        echo "✅ All required FTP secrets are configured"
    
    - name: Test FTP Connection to Qual
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/qual/
        dry-run: true
        exclude: |
          **/*
        dangerous-clean-slate: false
        
    - name: Test FTP Connection to Prod
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/
        dry-run: true
        exclude: |
          **/*
        dangerous-clean-slate: false
    
    - name: Create Migration Report
      run: |
        echo "# Migration Report" > migration-report.txt
        echo "=================" >> migration-report.txt
        echo "" >> migration-report.txt
        echo "Date: $(date)" >> migration-report.txt
        echo "Migrating from: SSH (port ${{ secrets.CPANEL_PORT || '21098' }})" >> migration-report.txt
        echo "Migrating to: FTP" >> migration-report.txt
        echo "" >> migration-report.txt
        echo "## Status" >> migration-report.txt
        echo "- ✅ FTP credentials validated" >> migration-report.txt
        echo "- ✅ Connection to qual tested" >> migration-report.txt
        echo "- ✅ Connection to prod tested" >> migration-report.txt
        echo "" >> migration-report.txt
        echo "## Next Steps" >> migration-report.txt
        echo "1. Update default workflow in repository settings" >> migration-report.txt
        echo "2. Monitor first FTP deployment" >> migration-report.txt
        echo "3. Remove old SSH workflow after successful deployments" >> migration-report.txt
        
        cat migration-report.txt
    
    - name: Update Workflow Permissions
      run: |
        echo "✅ Migration preparation complete!"
        echo ""
        echo "📋 To complete migration:"
        echo "1. Go to Settings → Actions → General"
        echo "2. Set 'deploy-ftp.yml' as the default workflow"
        echo "3. Run a test deployment to qual"
        echo "4. After successful deployment, archive 'deploy-fast.yml'"