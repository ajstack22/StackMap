name: FTP Clean Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'qual'
        type: choice
        options:
        - qual
        - production
      clean_deploy:
        description: 'Remove orphaned files'
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare deployment package
      run: |
        echo "📦 Preparing clean deployment to ${{ github.event.inputs.target }}..."
        
        # Create deployment directory
        mkdir -p deploy-package
        
        # Copy files with exclusions
        rsync -av \
          --exclude='.git*' \
          --exclude='node_modules' \
          --exclude='tests' \
          --exclude='docs' \
          --exclude='scripts' \
          --exclude='.github' \
          --exclude='package-lock.json' \
          --exclude='README.md' \
          --exclude='*.log' \
          --exclude='.DS_Store' \
          --exclude='mobile-launch-issues' \
          --exclude='ios-wrapper' \
          --exclude='store-assets' \
          --exclude='issues' \
          --exclude='launch-prompts' \
          --exclude='context/CICD_research.md' \
          --exclude='DEVELOPMENT_PLAN.md' \
          --exclude='FTP_*' \
          --exclude='*.sh' \
          ./ deploy-package/
        
        # Additional exclusions for production
        if [ "${{ github.event.inputs.target }}" = "production" ]; then
          rm -rf deploy-package/qual
          rm -rf deploy-package/.well-known
          echo "Excluded qual/ and .well-known/ for production"
        fi
        
        echo "📊 Package summary:"
        echo "Files: $(find deploy-package -type f | wc -l)"
        echo "Size: $(du -sh deploy-package | cut -f1)"
        
    - name: Deploy to ${{ github.event.inputs.target }}
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ github.event.inputs.target == 'production' && '/public_html/' || '/public_html/qual/' }}
        local-dir: ./deploy-package/
        dangerous-clean-slate: ${{ github.event.inputs.clean_deploy }}
        exclude: |
          **/.ftp-deploy-sync-state.json
          ${{ github.event.inputs.target == 'production' && '**/qual/**' || '' }}
          ${{ github.event.inputs.target == 'production' && '**/.well-known/**' || '' }}
          
    - name: Deployment summary
      run: |
        echo "✅ Deployment complete!"
        echo ""
        echo "🌐 View your site:"
        if [ "${{ github.event.inputs.target }}" = "production" ]; then
          echo "   https://stackmap.app/"
        else
          echo "   https://stackmap.app/qual/"
        fi
        echo ""
        echo "📝 Deployment details:"
        echo "   - Target: ${{ github.event.inputs.target }}"
        echo "   - Clean deploy: ${{ github.event.inputs.clean_deploy }}"
        echo "   - Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"