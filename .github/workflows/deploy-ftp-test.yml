name: FTP Deploy Test (Dry Run)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'qual'
        type: choice
        options:
        - qual
        - prod

jobs:
  dry-run-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: List files to be deployed
      run: |
        echo "📋 Files that would be deployed to ${{ github.event.inputs.target }}:"
        echo "================================================"
        
        # Create exclude patterns file
        cat > .ftp-deploy-exclude <<EOF
        .git*
        .git*/**
        node_modules/**
        tests/**
        docs/**
        scripts/**
        .github/**
        package-lock.json
        README.md
        *.log
        .DS_Store
        mobile-launch-issues/**
        ios-wrapper/**
        store-assets/**
        EOF
        
        # Add qual directory exclusion for prod
        if [ "${{ github.event.inputs.target }}" = "prod" ]; then
          echo "qual/**" >> .ftp-deploy-exclude
          echo ".well-known/**" >> .ftp-deploy-exclude
        fi
        
        # List all files that would be deployed
        find . -type f | grep -v -f .ftp-deploy-exclude | sort
        
        echo ""
        echo "📊 Summary:"
        echo "Total files: $(find . -type f | grep -v -f .ftp-deploy-exclude | wc -l)"
        echo "Total size: $(du -sh --exclude-from=.ftp-deploy-exclude . | cut -f1)"
    
    - name: Test FTP Connection
      run: |
        echo "🔌 Testing FTP connection..."
        # Note: This step would need actual FTP credentials to work
        echo "⚠️  Connection test skipped (requires secrets)"
        echo ""
        echo "Make sure these secrets are configured:"
        echo "- FTP_SERVER"
        echo "- FTP_USERNAME" 
        echo "- FTP_PASSWORD"
        
    - name: Dry Run Deployment
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ github.event.inputs.target == 'prod' && '/public_html/' || '/public_html/qual/' }}
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/docs/**
          **/scripts/**
          **/.github/**
          **/package-lock.json
          **/README.md
          **/*.log
          **/.DS_Store
          **/mobile-launch-issues/**
          **/ios-wrapper/**
          **/store-assets/**
          ${{ github.event.inputs.target == 'prod' && '**/qual/**' || '' }}
          ${{ github.event.inputs.target == 'prod' && '**/.well-known/**' || '' }}
        dry-run: true
        dangerous-clean-slate: false