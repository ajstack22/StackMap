name: Test FTP Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test FTP with curl
      run: |
        echo "Testing FTP connection..."
        echo "Server length: ${#FTP_SERVER}"
        
        # Test with curl (shows actual connection attempt)
        curl -v -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          "ftp://${{ secrets.FTP_SERVER }}/" --list-only || true
          
    - name: Test with lftp
      run: |
        sudo apt-get install -y lftp
        
        # Test with lftp (more detailed errors)
        lftp -c "set ftp:ssl-allow no; open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; ls; bye" || true