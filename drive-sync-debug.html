<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Sync Debug</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Google Drive Sync Debug Tool</h1>
    
    <div id="results"></div>
    
    <div style="margin-top: 20px;">
        <button onclick="runAllTests()">Run All Diagnostics</button>
        <button onclick="checkScriptLoading()">Check Script Loading</button>
        <button onclick="checkCredentials()">Check Credentials</button>
        <button onclick="testInitialization()">Test Initialization</button>
        <button onclick="checkDomain()">Check Domain</button>
    </div>
    
    <script>
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        function clearResults() {
            results.innerHTML = '';
        }
        
        async function runAllTests() {
            clearResults();
            log('<strong>Running Google Drive Sync Diagnostics...</strong>');
            
            await checkScriptLoading();
            await checkCredentials();
            await checkDomain();
            await testInitialization();
        }
        
        async function checkScriptLoading() {
            log('<strong>Checking Google API Scripts...</strong>');
            
            // Check if scripts are in DOM
            const gapiScript = document.querySelector('script[src*="apis.google.com/js/api.js"]');
            const gsiScript = document.querySelector('script[src*="accounts.google.com/gsi/client"]');
            
            if (!gapiScript) {
                log('❌ Google API script tag not found in page', 'error');
            } else {
                log('✅ Google API script tag found', 'success');
            }
            
            if (!gsiScript) {
                log('❌ Google Sign-In script tag not found in page', 'error');
            } else {
                log('✅ Google Sign-In script tag found', 'success');
            }
            
            // Check if APIs are loaded
            if (typeof gapi !== 'undefined') {
                log('✅ gapi object is loaded', 'success');
            } else {
                log('❌ gapi object not found - API script may be blocked', 'error');
            }
            
            if (typeof google !== 'undefined' && google.accounts) {
                log('✅ google.accounts object is loaded', 'success');
            } else {
                log('❌ google.accounts not found - Sign-in script may be blocked', 'error');
            }
            
            // Check for blocking
            try {
                const response = await fetch('https://apis.google.com/js/api.js', { method: 'HEAD' });
                if (response.ok) {
                    log('✅ Can reach Google API server', 'success');
                } else {
                    log('❌ Cannot reach Google API server - may be blocked', 'error');
                }
            } catch (error) {
                log(`❌ Network error reaching Google APIs: ${error.message}`, 'error');
            }
        }
        
        function checkCredentials() {
            log('<strong>Checking Credentials Configuration...</strong>');
            
            // Check window variables
            if (window.STACKMAP_GOOGLE_CLIENT_ID) {
                log(`✅ Client ID found: ${window.STACKMAP_GOOGLE_CLIENT_ID.substring(0, 20)}...`, 'success');
            } else {
                log('❌ STACKMAP_GOOGLE_CLIENT_ID not set', 'error');
            }
            
            if (window.STACKMAP_GOOGLE_API_KEY) {
                log(`✅ API Key found: ${window.STACKMAP_GOOGLE_API_KEY.substring(0, 10)}...`, 'success');
            } else {
                log('❌ STACKMAP_GOOGLE_API_KEY not set', 'error');
            }
            
            // Check CONFIG object
            if (typeof CONFIG !== 'undefined') {
                log('✅ CONFIG object exists', 'success');
                if (CONFIG.GOOGLE_CLIENT_ID) {
                    log('✅ CONFIG.GOOGLE_CLIENT_ID is set', 'success');
                } else {
                    log('❌ CONFIG.GOOGLE_CLIENT_ID is empty', 'error');
                }
                if (CONFIG.GOOGLE_API_KEY) {
                    log('✅ CONFIG.GOOGLE_API_KEY is set', 'success');
                } else {
                    log('❌ CONFIG.GOOGLE_API_KEY is empty', 'error');
                }
            } else {
                log('❌ CONFIG object not found', 'error');
            }
        }
        
        function checkDomain() {
            log('<strong>Checking Domain Configuration...</strong>');
            
            const currentDomain = window.location.origin;
            log(`Current domain: ${currentDomain}`, 'info');
            
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                log('⚠️ Not using HTTPS - Google APIs require HTTPS in production', 'warning');
            } else {
                log('✅ Using HTTPS or localhost', 'success');
            }
            
            log('Make sure this domain is added to Google Cloud Console:', 'info');
            log('1. Go to <a href="https://console.cloud.google.com" target="_blank">Google Cloud Console</a>', 'info');
            log('2. Select your project', 'info');
            log('3. APIs & Services → Credentials', 'info');
            log('4. Edit your OAuth 2.0 Client ID', 'info');
            log(`5. Add <strong>${currentDomain}</strong> to Authorized JavaScript origins`, 'info');
            log(`6. Add <strong>${currentDomain}</strong> to Authorized redirect URIs`, 'info');
        }
        
        async function testInitialization() {
            log('<strong>Testing Drive Sync Initialization...</strong>');
            
            // Check if app instance exists
            if (window.appInstance) {
                log('✅ App instance found', 'success');
                
                if (window.appInstance.driveSync === null) {
                    log('⚠️ driveSync is null - might be lazy loading or disabled', 'warning');
                } else if (window.appInstance.driveSync) {
                    log('✅ driveSync object exists', 'success');
                    log(`Is signed in: ${window.appInstance.driveSync.isSignedIn}`, 'info');
                } else {
                    log('❌ driveSync is undefined', 'error');
                }
            } else {
                log('❌ App instance not found - are you on the main app page?', 'error');
            }
            
            // Check URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const syncEnabled = urlParams.get('enableSync') === 'true';
            log(`URL parameter enableSync: ${syncEnabled}`, 'info');
            
            if (!syncEnabled && (!CONFIG || !CONFIG.GOOGLE_CLIENT_ID)) {
                log('⚠️ Sync requires either ?enableSync=true or valid credentials', 'warning');
            }
        }
        
        // Load required scripts if on debug page
        if (!document.querySelector('script[src*="env-loader.js"]')) {
            log('Loading app configuration...', 'info');
            
            const scripts = [
                'env-loader.js',
                'config/constants.js',
                'https://apis.google.com/js/api.js',
                'https://accounts.google.com/gsi/client'
            ];
            
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                if (src.includes('google')) {
                    script.async = true;
                    script.defer = true;
                }
                document.head.appendChild(script);
            });
        }
        
        // Auto-run diagnostics after a delay
        setTimeout(() => {
            runAllTests();
        }, 2000);
    </script>
</body>
</html>
