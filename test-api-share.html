<!DOCTYPE html>
<html>
<head>
    <title>API Share Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        pre {
            background: #f0f0f0;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>StackMap API Share Test</h1>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function testAPI(url, description) {
            const div = document.createElement('div');
            div.className = 'test';
            
            try {
                console.log(`Testing: ${url}`);
                const response = await fetch(url);
                const text = await response.text();
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    data = text;
                }
                
                div.className += response.ok ? ' success' : ' error';
                div.innerHTML = `
                    <h3>${description}</h3>
                    <p>URL: <code>${url}</code></p>
                    <p>Status: ${response.status} ${response.statusText}</p>
                    <p>Headers:</p>
                    <pre>${Array.from(response.headers.entries()).map(([k,v]) => `${k}: ${v}`).join('\n')}</pre>
                    <p>Response:</p>
                    <pre>${typeof data === 'string' ? data.substring(0, 500) : JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                div.className += ' error';
                div.innerHTML = `
                    <h3>${description}</h3>
                    <p>URL: <code>${url}</code></p>
                    <p>Error: ${error.message}</p>
                `;
            }
            
            results.appendChild(div);
        }
        
        // Run tests
        (async () => {
            // Test basic endpoint
            await testAPI('./api/sync/test_endpoint.php', 'Basic API Test');
            
            // Test access_share with invalid token
            await testAPI('./api/sync/access_share.php?token=INVALID', 'Access Share - Invalid Token');
            
            // Test access_share with v1 format token
            await testAPI('./api/sync/access_share.php?token=ABC123', 'Access Share - V1 Token');
            
            // Test access_share with v2 format token  
            await testAPI('./api/sync/access_share.php?token=7IWRXXZomZaoCcky19l0eBoF6m4cXKNbCUmeCVZF4DM', 'Access Share - V2 Token');
            
            // Test without token
            await testAPI('./api/sync/access_share.php', 'Access Share - No Token');
        })();
    </script>
</body>
</html>
