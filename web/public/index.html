<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StackMap">
  <link rel="apple-touch-icon" href="./icons/icon-152.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
  
  <!-- SEO and Social -->
  <meta name="description" content="Visual task manager for organizing your daily activities">
  <meta property="og:title" content="StackMap">
  <meta property="og:description" content="Visual task manager for organizing your daily activities">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/icons/icon-512.png">
  
  <title>StackMap</title>
  
  <!-- Capture hash immediately -->
  <script>
    // Capture URL hash at the earliest possible moment
    (function() {
      if (window.location.hash) {
        window.__initialHash = window.location.hash;
        window.__hashCapturedAt = new Date().toISOString();
        console.log('[HTML] Hash captured immediately:', window.__initialHash);
        
        const pathname = window.location.pathname;
        
        // Parse sync data right away
        if (pathname.includes('/sync/')) {
          const match = pathname.match(/\/sync\/([A-Z0-9]{4}-[A-Z0-9]{4})/i);
          if (match) {
            window.__earlySyncData = {
              inviteCode: match[1],
              hash: window.__initialHash,
              recoveryPhrase: window.__initialHash.substring(1).split('#')[0]
            };
            console.log('[HTML] Early sync data:', window.__earlySyncData);
          }
        }
        
        // Parse share data right away
        if (pathname.includes('/share/')) {
          const match = pathname.match(/\/share\/([A-Za-z0-9\-_]+)/);
          if (match) {
            window.__earlyShareData = {
              shareId: match[1],
              hash: window.__initialHash,
              encryptionKey: window.__initialHash.substring(1)
            };
            console.log('[HTML] Early share data:', window.__earlyShareData);
          }
        }
      } else {
        window.__noHashDetected = true;
        console.log('[HTML] No hash detected at page load');
      }
    })();
  </script>
  
  <!-- Material Icons Font -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
    }
    
    html, body, #root {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: 'Comic Relief', 'Comic Sans MS', cursive, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Loading screen */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f7fafc;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  
  <!-- Minimal polyfills for React Native Web -->
  <script>
    // Set up global object
    if (typeof global === 'undefined') {
      window.global = window;
    }
    
    // Mock native bridge to prevent React Native errors
    window.__fbBatchedBridgeConfig = {
      remoteModuleConfig: [],
      localModulesConfig: [],
    };
    
    // Mock TurboModuleRegistry for native modules
    window.__turboModuleProxy = function(name) {
      if (name === 'SourceCode') {
        return {
          getConstants: () => ({
            scriptURL: 'http://localhost:8081/index.bundle?platform=web',
          }),
        };
      }
      if (name === 'DeviceInfo') {
        return {
          getConstants: () => ({
            Dimensions: {
              window: {
                width: window.innerWidth || 1024,
                height: window.innerHeight || 768,
                scale: 1,
                fontScale: 1,
              },
              screen: {
                width: window.screen?.width || window.innerWidth || 1024,
                height: window.screen?.height || window.innerHeight || 768,
                scale: 1,
                fontScale: 1,
              },
            },
            isTablet: false,
            isEmulator: false,
          }),
        };
      }
      return null;
    };
  </script>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>
</body>
</html>
