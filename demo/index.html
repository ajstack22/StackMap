<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StackMap - Mushroom Kingdom Demo</title>
    
    <!-- All CSS files -->
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/cards.css">
    <link rel="stylesheet" href="../styles/modals.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <link rel="stylesheet" href="../styles/hybrid-panels.css">
    <link rel="stylesheet" href="../styles/selectors.css">
    <link rel="stylesheet" href="../styles/sync-modal.css">
    <link rel="stylesheet" href="../styles/animations.css">
    <link rel="stylesheet" href="../styles/celebrations.css">
    <link rel="stylesheet" href="../styles/fab.css">
    <link rel="stylesheet" href="../styles/draggable-drawer.css">
    <link rel="stylesheet" href="../styles/splash-screen.css">
    <link rel="stylesheet" href="../styles/utilities.css">
    <link rel="stylesheet" href="../styles/cards-autosize.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <!-- Header Wrapper for unified shadow -->
    <div class="header-wrapper" id="headerWrapper">
        <!-- Unified Application Header -->
        <header class="app-header" role="banner" id="appHeader">
            <div class="header-content">
                <div class="header-logo-title">
                    <div class="stackmap-logo" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                            <circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
                            <rect x="7" y="10" width="18" height="2.5" fill="var(--primary-color)" rx="1.25"/>
                            <rect x="7" y="14.5" width="18" height="2.5" fill="var(--primary-color)" rx="1.25"/>
                            <rect x="7" y="19" width="18" height="5" fill="var(--primary-dark)" rx="2.5"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1 class="title" id="mainTitle" tabindex="0">StackMap</h1>
                        <p class="subtitle" id="subtitle" tabindex="0">Routine Ready</p>
                    </div>
                </div>
            </div>
        </header>
    </div>
    
    <!-- Main Content Area -->
    <main id="main-content" role="main" aria-label="Task routine">
        <div class="main-container" id="mainContainer" role="region" aria-label="Task cards">
            <!-- Activity cards will be rendered here -->
        </div>
    </main>

    <!-- Hidden File Input for Import -->
    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <!-- Scripts -->
    <script>
        // Set demo mode flag first
        window.DEMO_MODE = true;
        
        // SYNCHRONOUSLY load demo data before anything else
        // This blocks all other scripts from loading until demo data is set
        (function() {
            // Only clear demo-specific data, not all localStorage
            localStorage.removeItem('stackMapData-demo');
            localStorage.removeItem('stackMapDemoMode');
            
            const xhr = new XMLHttpRequest();
            xhr.open('GET', '../demo-mushroom-kingdom.json', false); // false = synchronous
            xhr.send();
            
            if (xhr.status === 200) {
                const demoData = JSON.parse(xhr.responseText);
                // Use a demo-specific key to avoid contaminating main app
                localStorage.setItem('stackMapData-demo', JSON.stringify(demoData));
                localStorage.setItem('stackMapDemoMode', 'true');
                console.log('Demo data loaded successfully. Current user:', demoData.users?.currentUserId);
                console.log('User profiles:', Object.keys(demoData.users?.profiles || {}));
            } else {
                console.error('Failed to load demo data');
            }
        })();
    </script>
    
    <!-- Load all required scripts in order -->
    <script src="../utils/security.js"></script>
    <script src="../config/constants.js"></script>
    <script src="../config/themes.js"></script>
    <script src="../data/emoji-list.js"></script>
    <script src="../data/emoji-names.js"></script>
    <script src="../data/default-activities.js"></script>
    <script src="../state.js"></script>
    <script src="../components.js"></script>
    <script src="../renderer.js"></script>
    <script src="../drive-sync.js"></script>
    
    <!-- Load managers -->
    <script src="../js/DynamicMenuSystem.js"></script>
    <script src="../js/MenuConfigurations.js"></script>
    <script src="../js/HybridPanelManager.js"></script>
    <script src="../js/CelebrationManager.js"></script>
    
    <!-- Load modern components -->
    <script src="../components/ModernUserSelector.js"></script>
    <script src="../components/ModernDaySelector.js"></script>
    <script src="../components/DraggableDrawer.js"></script>
    
    <!-- Main App -->
    <script src="../app/StackMapApp.js"></script>
    
    <!-- Google APIs -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    
    <!-- Initialize exactly like main app -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try {
                window.appInstance = new StackMapApp();
                window.hybridPanelManager = new HybridPanelManager(window.appInstance);
                window.appInstance.init();
            } catch (error) {
                console.error('Failed to initialize app:', error);
            }
        });
    </script>
</body>
</html>
