<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackMap - Mushroom Kingdom Demo</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/cards.css">
    <link rel="stylesheet" href="../styles/modals.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <link rel="stylesheet" href="../styles/hybrid-panels.css">
    <link rel="stylesheet" href="../styles/selectors.css">
    <link rel="stylesheet" href="../styles/sync-modal.css">
    <link rel="stylesheet" href="../styles/animations.css">
    <link rel="stylesheet" href="../styles/celebrations.css">
    <link rel="stylesheet" href="../styles/fab.css">
    <link rel="stylesheet" href="../styles/draggable-drawer.css">
    <link rel="stylesheet" href="../styles/splash-screen.css">
    <link rel="stylesheet" href="../styles/utilities.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <!-- Main App Container -->
    <div id="app"></div>

    <!-- Hidden File Input for Import -->
    <input type="file" id="fileInput" accept=".json" style="display: none;">
    
    <!-- Load JavaScript files in dependency order -->
    <script src="../utils/security.js"></script>
    <script src="../config/constants.js"></script>
    <script src="../config/themes.js"></script>
    <script src="../data/emoji-list.js"></script>
    <script src="../data/emoji-names.js"></script>
    <script src="../data/default-activities.js"></script>
    <script src="../state.js"></script>
    <script src="../components.js"></script>
    <script src="../renderer.js"></script>
    <script src="../drive-sync.js"></script>
    
    <!-- Load managers -->
    <script src="../js/DynamicMenuSystem.js"></script>
    <script src="../js/MenuConfigurations.js"></script>
    <script src="../js/HybridPanelManager.js"></script>
    <script src="../js/CelebrationManager.js"></script>
    
    <!-- Load modern components -->
    <script src="../components/ModernUserSelector.js"></script>
    <script src="../components/ModernDaySelector.js"></script>
    <script src="../components/DraggableDrawer.js"></script>
    
    <!-- Main App -->
    <script src="../app/StackMapApp.js"></script>
    
    <!-- Google APIs (needed even with sync disabled) -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    
    <script>
        // Demo initialization - just load the demo data and run the normal app
        async function initializeDemo() {
            try {
                // Load the demo data
                const response = await fetch('../demo-mushroom-kingdom.json');
                const demoData = await response.json();
                
                // Store in localStorage
                localStorage.setItem('stackMapState', JSON.stringify(demoData));
                localStorage.setItem('stackMapDemoMode', 'true');
                
                // Initialize the app normally
                const app = new StackMapApp();
                window.appInstance = app;
                app.init();
                
            } catch (error) {
                console.error('Failed to initialize demo:', error);
                alert('Failed to load demo. Please try refreshing the page.');
            }
        }
        
        // Prevent demo data from syncing
        window.DEMO_MODE = true;
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializeDemo);
    </script>
</body>
</html>
