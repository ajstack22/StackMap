<!DOCTYPE html>
<html>
<head>
    <title>Clear StackMap Cache</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px 0;
            cursor: pointer;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        .log {
            background: #f4f4f4;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Clear StackMap Cache</h1>
    <p>Use this tool to forcefully clear all service worker caches and unregister service workers.</p>
    
    <button onclick="clearEverything()">Clear All Caches & Service Workers</button>
    <button onclick="checkCaches()">Check Current Caches</button>
    
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message, className = '') {
            const div = document.createElement('div');
            div.className = 'log ' + className;
            div.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            output.appendChild(div);
        }
        
        async function clearEverything() {
            try {
                log('Starting cache and service worker cleanup...');
                
                // 1. Get all cache names
                const cacheNames = await caches.keys();
                log(`Found ${cacheNames.length} caches: ${cacheNames.join(', ')}`);
                
                // 2. Delete all caches
                for (const cacheName of cacheNames) {
                    await caches.delete(cacheName);
                    log(`Deleted cache: ${cacheName}`, 'success');
                }
                
                // 3. Get all service worker registrations
                const registrations = await navigator.serviceWorker.getRegistrations();
                log(`Found ${registrations.length} service worker registrations`);
                
                // 4. Unregister all service workers
                for (const registration of registrations) {
                    await registration.unregister();
                    log(`Unregistered service worker: ${registration.scope}`, 'success');
                }
                
                // 5. Clear browser storage
                if ('storage' in navigator && 'estimate' in navigator.storage) {
                    const estimate = await navigator.storage.estimate();
                    log(`Storage usage: ${(estimate.usage / 1024 / 1024).toFixed(2)} MB of ${(estimate.quota / 1024 / 1024).toFixed(2)} MB`);
                }
                
                log('All caches and service workers cleared!', 'success');
                log('Please close all StackMap tabs and open a new one to ensure fresh content.');
                
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
        
        async function checkCaches() {
            try {
                log('Checking current caches...');
                
                const cacheNames = await caches.keys();
                if (cacheNames.length === 0) {
                    log('No caches found');
                    return;
                }
                
                for (const cacheName of cacheNames) {
                    const cache = await caches.open(cacheName);
                    const requests = await cache.keys();
                    log(`\nCache: ${cacheName} (${requests.length} items)`);
                    
                    // Show first few items
                    requests.slice(0, 5).forEach(request => {
                        const url = request.url.replace(window.location.origin, '');
                        log(`  - ${url}`);
                    });
                    
                    if (requests.length > 5) {
                        log(`  ... and ${requests.length - 5} more items`);
                    }
                }
                
                // Check service workers
                const registrations = await navigator.serviceWorker.getRegistrations();
                log(`\nService Workers: ${registrations.length} registered`);
                registrations.forEach(reg => {
                    log(`  - Scope: ${reg.scope}`);
                    if (reg.active) {
                        log(`    State: active`);
                    }
                });
                
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
