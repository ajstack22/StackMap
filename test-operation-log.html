<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Log Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            margin-top: 0;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .log-entry {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            margin: 5px 0;
            font-size: 14px;
        }
        .pending { border-left: 4px solid #ffc107; }
        .synced { border-left: 4px solid #28a745; }
        .failed { border-left: 4px solid #dc3545; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>StackMap Operation Log Test</h1>
    
    <div class="container">
        <div class="panel">
            <h2>Test Operations</h2>
            <div>
                <button onclick="testAddActivity()">Add Activity</button>
                <button onclick="testUpdateActivity()">Update Activity</button>
                <button onclick="testRemoveActivity()">Remove Activity</button>
                <button onclick="testMoveActivity()">Move Activity</button>
                <button onclick="testUpdateUser()">Update User</button>
                <button onclick="testSwitchUser()">Switch User</button>
            </div>
            
            <h3>Sync Operations</h3>
            <div>
                <button onclick="markSomeSynced()">Mark Some Synced</button>
                <button onclick="markSomeFailed()">Mark Some Failed</button>
                <button onclick="clearDirtyFlags()">Clear Dirty Flags</button>
                <button onclick="resetLog()">Reset Log</button>
            </div>
            
            <h3>View Operations</h3>
            <div>
                <button onclick="showStats()">Show Stats</button>
                <button onclick="showChangedData()">Show Changed Data</button>
                <button onclick="showFullLog()">Show Full Log</button>
            </div>
            
            <div class="stats" id="stats"></div>
        </div>
        
        <div class="panel">
            <h2>Operation Log</h2>
            <div id="log"></div>
        </div>
    </div>
    
    <div class="panel" style="margin-top: 20px;">
        <h2>Changed Data Output</h2>
        <pre id="changedData"></pre>
    </div>

    <script>
        // Mock CONFIG object
        const CONFIG = {
            DEFAULT_USER_ID: 'default_user',
            DEFAULT_COLOR: '#6200EA',
            DEFAULT_EMOJI: '📝',
            MAX_ACTIVITIES: 50,
            MAX_USERS: 10,
            USER_NAME_MAX_LENGTH: 50,
            SHOW_NUMBERS_DEFAULT: true,
            SHOW_COMPLETION_DEFAULT: true,
            DATA_VERSION: '2.0',
            DISPLAY_MODES: {
                NONE: 'none',
                NUMBERS: 'numbers',
                TIMES: 'times'
            }
        };
    </script>
    <script src="state.js"></script>
    <script>
        const appState = new AppState();
        
        function updateDisplay() {
            showStats();
            showOperationLog();
        }
        
        function showStats() {
            const stats = appState.getOperationLogStats();
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${stats.totalOperations}</div>
                    <div class="stat-label">Total Operations</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.pendingOperations}</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.syncedOperations}</div>
                    <div class="stat-label">Synced</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.failedOperations}</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.dirtyUsers}</div>
                    <div class="stat-label">Dirty Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.dirtyActivities}</div>
                    <div class="stat-label">Dirty Activities</div>
                </div>
            `;
        }
        
        function showOperationLog() {
            const log = appState.getOperationLog();
            const logDiv = document.getElementById('log');
            
            if (log.length === 0) {
                logDiv.innerHTML = '<p>No operations yet</p>';
                return;
            }
            
            logDiv.innerHTML = log.slice(-10).reverse().map(op => `
                <div class="log-entry ${op.syncStatus}">
                    <strong>${op.type}</strong> - ${new Date(op.timestamp).toLocaleTimeString()}<br>
                    <small>ID: ${op.id}</small><br>
                    <small>User: ${op.userId}</small><br>
                    <small>Status: ${op.syncStatus}</small><br>
                    <small>Data: ${JSON.stringify(op.data)}</small>
                </div>
            `).join('');
        }
        
        function testAddActivity() {
            const activityId = `test_${Date.now()}`;
            appState._trackOperation('add-activity', {
                activityId: activityId,
                title: 'Test Activity',
                userId: appState.users.currentUserId,
                isToday: true
            });
            updateDisplay();
        }
        
        function testUpdateActivity() {
            appState._trackOperation('update-activity', {
                activityId: 'test_activity_1',
                userId: appState.users.currentUserId,
                updates: { title: 'Updated Activity', completed: true }
            });
            updateDisplay();
        }
        
        function testRemoveActivity() {
            appState._trackOperation('remove-activity', {
                activityId: 'test_activity_2',
                userId: appState.users.currentUserId,
                index: 2
            });
            updateDisplay();
        }
        
        function testMoveActivity() {
            appState._trackOperation('move-activity', {
                activityId: 'test_activity_3',
                userId: appState.users.currentUserId,
                fromIndex: 1,
                toIndex: 3
            });
            updateDisplay();
        }
        
        function testUpdateUser() {
            appState._trackOperation('update-user', {
                userId: appState.users.currentUserId,
                updates: { name: 'Updated User Name', icon: '🎯' }
            });
            updateDisplay();
        }
        
        function testSwitchUser() {
            appState._trackOperation('switch-user', {
                fromUserId: appState.users.currentUserId,
                toUserId: 'another_user_id'
            });
            updateDisplay();
        }
        
        function markSomeSynced() {
            const pendingOps = appState._getUnsyncedOperations();
            if (pendingOps.length > 0) {
                const toSync = pendingOps.slice(0, Math.ceil(pendingOps.length / 2));
                appState._markOperationsSynced(toSync.map(op => op.id));
                updateDisplay();
            }
        }
        
        function markSomeFailed() {
            const pendingOps = appState._getUnsyncedOperations();
            if (pendingOps.length > 0) {
                const toFail = pendingOps.slice(0, 1);
                appState._markOperationsFailed(toFail.map(op => op.id));
                updateDisplay();
            }
        }
        
        function clearDirtyFlags() {
            appState.clearDirtyFlags();
            updateDisplay();
        }
        
        function resetLog() {
            if (confirm('Reset the entire operation log?')) {
                appState.resetOperationLog();
                updateDisplay();
            }
        }
        
        function showChangedData() {
            const changedData = appState.getChangedData();
            document.getElementById('changedData').textContent = JSON.stringify(changedData, null, 2);
        }
        
        function showFullLog() {
            const log = appState.getOperationLog();
            document.getElementById('changedData').textContent = JSON.stringify(log, null, 2);
        }
        
        // Initial display
        updateDisplay();
    </script>
</body>
</html>
