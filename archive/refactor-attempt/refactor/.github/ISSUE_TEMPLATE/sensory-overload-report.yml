name: Sensory Overload Report
description: Report visual, auditory, or tactile elements that cause sensory discomfort
title: "[SENSORY] "
labels: ["accessibility", "sensory", "neurodivergent", "urgent"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🌟 Your sensory comfort matters to us
        
        This form helps us identify and fix elements that may cause sensory overload or discomfort.
        Take your time, and share only what feels comfortable.
        
  - type: dropdown
    id: sensory-type
    attributes:
      label: Type of sensory issue
      multiple: true
      options:
        - Visual (colors, brightness, movement)
        - Auditory (sounds, alerts, volume)
        - Tactile (vibrations, haptic feedback)
        - Vestibular (motion sickness, dizziness)
        - Cognitive overload (too much information)
        - Multiple sensory types
    validations:
      required: true
      
  - type: dropdown
    id: specific-trigger
    attributes:
      label: Specific trigger (select all that apply)
      multiple: true
      options:
        - Bright or harsh colors
        - High contrast combinations
        - Flashing or blinking elements
        - Rapid animations
        - Parallax scrolling
        - Multiple moving elements
        - Sudden sounds
        - Repetitive sounds
        - High-pitched tones
        - Loud notifications
        - Strong vibrations
        - Rapid haptic patterns
        - Information density
        - Cluttered layouts
    validations:
      required: true
      
  - type: range
    id: intensity
    attributes:
      label: Intensity of discomfort
      description: How intense is the sensory discomfort? (1 = mild, 10 = unbearable)
      min: 1
      max: 10
      step: 1
      default: 5
    validations:
      required: true
      
  - type: textarea
    id: physical-response
    attributes:
      label: Physical response (optional)
      description: |
        Only share if comfortable - this helps us understand severity
      placeholder: |
        Examples:
        - "I have to close my eyes"
        - "I get a headache after a few minutes"
        - "I feel nauseous from the motion"
        - "My anxiety increases"
    validations:
      required: false
      
  - type: textarea
    id: location
    attributes:
      label: Where in the app does this occur?
      description: Please be as specific as possible
      placeholder: |
        Example: "On the main task list when scrolling" or
        "The loading animation between screens"
    validations:
      required: true
      
  - type: dropdown
    id: time-of-day
    attributes:
      label: Is this worse at certain times?
      options:
        - Always the same
        - Worse in the morning
        - Worse in the evening
        - Worse when tired
        - Worse in bright environments
        - Worse in dark environments
        - Varies unpredictably
    validations:
      required: false
      
  - type: textarea
    id: current-settings
    attributes:
      label: Current accessibility settings
      description: What settings do you have enabled?
      placeholder: |
        Examples:
        - Dark mode on/off
        - Reduced motion enabled
        - System text size
        - Color filters
    validations:
      required: false
      
  - type: textarea
    id: ideal-solution
    attributes:
      label: What would help?
      description: Describe your ideal solution
      placeholder: |
        Examples:
        - "Option to turn off all animations"
        - "Softer color palette"
        - "Silent mode with no haptics"
        - "Simpler layout with more spacing"
    validations:
      required: true
      
  - type: checkboxes
    id: immediate-needs
    attributes:
      label: Immediate needs
      options:
        - label: This is preventing me from using the app
        - label: I need a temporary workaround ASAP
        - label: I'm okay waiting for a proper fix
    validations:
      required: true
      
  - type: dropdown
    id: preferred-preset
    attributes:
      label: Which sensory preset might help you?
      description: We're planning these presets - which sounds most helpful?
      options:
        - Calm Mode (muted colors, slow transitions, nature sounds)
        - Focus Mode (dark theme, reduced motion, no sounds)
        - Minimal Mode (text-only, no animations, silent)
        - Energy Mode (clear contrasts, quick feedback, gentle haptics)
        - Custom combination
        - Not sure
    validations:
      required: false
      
  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: |
        Anything else that might help us create a more comfortable experience?
        Remember: your sensory needs are valid and important.
      placeholder: |
        Feel free to share any context about your sensory processing differences,
        what works well in other apps, or specific accommodations that help you.