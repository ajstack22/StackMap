<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackMap - Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
        }
        
        .header {
            background: #2a2a2a;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .content {
            padding: 1rem;
        }
        
        .activity-item {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .activity-add-button {
            width: 100%;
            padding: 1rem;
            background: #333;
            border: 2px dashed #666;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        
        .activity-add-button:hover {
            background: #444;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
        
        .activity-title {
            flex: 1;
            font-size: 1rem;
        }
        
        .edit-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .delete-button {
            background: #f44336;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 0.5rem;
        }
        
        .hidden {
            display: none;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>StackMap</h1>
        <button id="edit-toggle" class="edit-button">Edit Mode</button>
    </div>
    
    <div class="content">
        <div id="edit-controls" class="hidden">
            <button class="activity-add-button" onclick="addActivity()">+ Add Activity</button>
        </div>
        
        <div id="activity-container">
            <div class="empty-state">
                <h3>No activities for today</h3>
                <p>Click Edit Mode to add your first activity</p>
            </div>
        </div>
    </div>

    <script>
        let activities = JSON.parse(localStorage.getItem('stackmap_activities') || '[]');
        let editMode = false;

        function render() {
            const container = document.getElementById('activity-container');
            
            if (activities.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No activities for today</h3>
                        <p>Click Edit Mode to add your first activity</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = activities.map((activity, index) => `
                <div class="activity-item">
                    <input type="checkbox" ${activity.completed ? 'checked' : ''} 
                           onchange="toggleComplete(${index})">
                    <span class="activity-title" style="text-decoration: ${activity.completed ? 'line-through' : 'none'}">
                        ${activity.title}
                    </span>
                    ${editMode ? `
                        <button class="edit-button" onclick="editActivity(${index})">Edit</button>
                        <button class="delete-button" onclick="deleteActivity(${index})">Delete</button>
                    ` : ''}
                </div>
            `).join('');
        }

        function toggleEditMode() {
            editMode = !editMode;
            const button = document.getElementById('edit-toggle');
            const controls = document.getElementById('edit-controls');
            
            button.textContent = editMode ? 'Exit Edit' : 'Edit Mode';
            controls.classList.toggle('hidden', !editMode);
            render();
        }

        function addActivity() {
            const title = prompt('Activity title:');
            if (title) {
                activities.push({
                    id: Date.now(),
                    title: title,
                    completed: false
                });
                saveActivities();
                render();
            }
        }

        function editActivity(index) {
            const newTitle = prompt('Edit activity:', activities[index].title);
            if (newTitle) {
                activities[index].title = newTitle;
                saveActivities();
                render();
            }
        }

        function deleteActivity(index) {
            if (confirm('Delete this activity?')) {
                activities.splice(index, 1);
                saveActivities();
                render();
            }
        }

        function toggleComplete(index) {
            activities[index].completed = !activities[index].completed;
            saveActivities();
            render();
        }

        function saveActivities() {
            localStorage.setItem('stackmap_activities', JSON.stringify(activities));
        }

        // Initialize
        document.getElementById('edit-toggle').addEventListener('click', toggleEditMode);
        render();
    </script>
</body>
</html>
