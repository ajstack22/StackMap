<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="StackMap">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <title>StackMap</title>
    
    <!-- PWA Meta -->
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-startup-image" href="icon-512.png">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Comic Relief Font -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Cache Control Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="src/stackmap.css?v=2.0.0">
</head>
<body>
    <!-- Complementary Header (shown when banner is at bottom) -->
    <div class="complementary-header"></div>
    
    <!-- Header Wrapper -->
    <div class="header-wrapper" id="headerWrapper">
        <header class="app-header" role="banner" id="appHeader">
            <div class="header-content">
                <div class="header-logo-title">
                    <div class="stackmap-logo" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                            <circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
                            <rect x="7" y="10" width="18" height="2.5" fill="var(--primary-color)" rx="1.25"/>
                            <rect x="7" y="14.5" width="18" height="2.5" fill="var(--primary-color)" rx="1.25"/>
                            <rect x="7" y="19" width="18" height="5" fill="var(--primary-dark)" rx="2.5"/>
                        </svg>
                    </div>
                    <div class="header-text">
                        <h1 class="title" id="mainTitle" tabindex="0" onclick="app.editMainTitle()" style="cursor: pointer;">StackMap</h1>
                        <p class="subtitle" id="subtitle" tabindex="0">Routine Ready</p>
                    </div>
                </div>
            </div>
        </header>
        <!-- Exit Edit Mode Button -->
        <button class="header-exit-edit-mode" id="headerExitEditMode" style="display: none;">
            <span class="material-icons">close</span>
            <span>Exit Edit Mode</span>
        </button>
    </div>
    
    <!-- Main Content -->
    <main class="main-content">
        <div class="activity-list" id="activityList">
            <div class="empty-state">
                <h3>No activities yet</h3>
                <p>Use the edit button to add your first activity</p>
            </div>
        </div>
    </main>
    
    <!-- Floating Action Buttons -->
    <div class="fab-container left">
        <button class="fab" id="preferencesBtn" aria-label="Open preferences" title="Preferences">
            <span class="material-icons">palette</span>
        </button>
    </div>
    
    <div class="fab-container right">
        <button class="fab" id="editBtn" aria-label="Open edit mode" title="Edit Mode">
            <span class="material-icons">edit</span>
        </button>
    </div>
    
    <!-- Left Panel (User & Day) -->
    <div class="side-panel left" id="userDayPanel">
        <div class="panel-header">
            <div class="panel-title">Select</div>
            <button class="panel-close" id="userDayClose" aria-label="Close panel">×</button>
        </div>
        <div class="panel-content" id="userDayContent">
            <!-- Content will be rendered dynamically -->
        </div>
    </div>
    
    <!-- Left Panel (Preferences) -->
    <div class="side-panel left" id="preferencesPanel">
        <div class="panel-header">
            <div class="panel-title">Preferences</div>
            <button class="panel-close" id="preferencesClose" aria-label="Close preferences">×</button>
        </div>
        <div class="panel-content" id="preferencesContent">
            <div class="form-group">
                <label class="form-label">Theme Color</label>
                <div id="colorPicker">
                    <!-- Color options will be added here -->
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Display Mode</label>
                <div id="displayModeToggle">
                    <!-- Display mode options will be added here -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Right Panel (Edit Mode) -->
    <div class="side-panel right" id="editPanel">
        <div class="panel-header">
            <button class="panel-close" id="editClose" aria-label="Close edit panel">×</button>
            <div class="panel-title">Edit Mode</div>
        </div>
        <div class="panel-content" id="editContent">
            <!-- Validation or edit content will be loaded here -->
        </div>
    </div>
    
    <!-- Backdrop -->
    <div class="backdrop" id="backdrop"></div>
    
    
    <!-- Activity Library Panel -->
    <div class="side-panel right" id="activityLibraryPanel">
        <div class="panel-header">
            <button class="panel-close" id="activityLibraryClose" aria-label="Close activity library">×</button>
            <div class="panel-title">Activity Library</div>
        </div>
        <div class="panel-content">
            <div class="library-tabs">
                <button class="library-tab active" id="defaultActivitiesTab">Default</button>
                <button class="library-tab" id="myTemplatesTab">My Templates</button>
            </div>
            <div class="library-controls">
                <input type="text" 
                       id="librarySearchInput" 
                       class="library-search" 
                       placeholder="Type to filter activities..."
                       autocomplete="off">
                <div class="library-batch-controls" id="libraryBatchControls" style="display: none;">
                    <button class="btn-batch-cancel" onclick="app.clearSelection()">Cancel</button>
                    <button class="btn-batch-add" onclick="app.addSelectedActivities()">
                        Add <span class="selected-count">0</span> Selected
                    </button>
                </div>
            </div>
            <div id="activityLibraryBody">
                <!-- Content will be rendered here -->
            </div>
        </div>
    </div>
    
    <!-- Card menu dropdown -->
    <div id="cardMenu" class="card-menu">
        <button class="card-menu-item" onclick="app.editActivityFromMenu()">
            <span class="material-icons">edit</span>
            Edit
        </button>
        <button class="card-menu-item" onclick="app.duplicateActivityFromMenu()">
            <span class="material-icons">content_copy</span>
            Duplicate
        </button>
        <button class="card-menu-item" onclick="app.saveAsTemplateFromMenu()">
            <span class="material-icons">bookmark</span>
            Save as Template
        </button>
        <button class="card-menu-item card-menu-item--delete" onclick="app.deleteActivityFromMenu()">
            <span class="material-icons">delete</span>
            Delete
        </button>
    </div>

    <!-- Capacitor Core JS -->
    <!-- Capacitor is loaded via the mobile app, not needed in web version -->
    
    <script src="src/CelebrationManager.js?v=2.0.0"></script>
    <script src="src/stackmap.js?v=2.0.0"></script>
    
    <!-- Service Worker Registration with Update Detection -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(registration => {
                // Check for updates immediately
                registration.update();
                
                // Check for updates every 5 minutes
                setInterval(() => {
                    registration.update();
                }, 5 * 60 * 1000);
                
                // Listen for updates
                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    const hasExistingWorker = registration.active !== null;
                    
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'activated' && hasExistingWorker) {
                            // Only show update notification if there was a previous worker
                            // This prevents showing the message on first visit
                            if (confirm('StackMap has been updated! Reload to see the latest version?')) {
                                window.location.reload();
                            }
                        }
                    });
                });
            })
            .catch(err => console.log('Service Worker registration failed:', err));
    }
    </script>
    
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- Complementary Footer (shown when banner is at top) -->
    <div class="complementary-footer"></div>
</body>
</html>
