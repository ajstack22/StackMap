---
deployment:
  tasks:
    # Set deployment path (replace 'username' with your cPanel username)
    - export DEPLOYPATH=/home/stachblx/public_html/mu
    
    # StackMap specific files - copy everything recursively
    - /bin/cp -R * $DEPLOYPATH
    
    # Alternative: Selective copying for better control
    # Core files
    # - /bin/cp index.html $DEPLOYPATH
    # - /bin/cp StackMapApp.js $DEPLOYPATH
    # - /bin/cp state.js $DEPLOYPATH
    # - /bin/cp renderer.js $DEPLOYPATH
    # - /bin/cp components.js $DEPLOYPATH
    # - /bin/cp drive-sync.js $DEPLOYPATH
    # - /bin/cp sw.js $DEPLOYPATH
    # - /bin/cp manifest.json $DEPLOYPATH
    # - /bin/cp offline.html $DEPLOYPATH
    
    # Copy directories
    # - /bin/cp -R config $DEPLOYPATH
    # - /bin/cp -R data $DEPLOYPATH
    # - /bin/cp -R app $DEPLOYPATH
    # - /bin/cp -R styles $DEPLOYPATH
    
    # Set proper permissions for cPanel
    - /bin/chmod 755 $DEPLOYPATH
    - /bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 '{}' \;
    - /bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 '{}' \;