<!DOCTYPE html>
<html>
<head>
    <title>Resource Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        code {
            background-color: #f0f0f0;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>StackMap Resource Test</h1>
    <p>This page tests if all resources are accessible.</p>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        async function testResource(url, type) {
            const div = document.createElement('div');
            div.className = 'test';
            
            try {
                const response = await fetch(url);
                const contentType = response.headers.get('content-type');
                
                if (response.ok) {
                    div.className += ' success';
                    div.innerHTML = `
                        <strong>✓ ${type}:</strong> <code>${url}</code><br>
                        Status: ${response.status}<br>
                        Content-Type: ${contentType || 'not specified'}<br>
                        Size: ${response.headers.get('content-length') || 'unknown'} bytes
                    `;
                    
                    // For fonts, check if it's actually a font file
                    if (type.includes('Font') && contentType && !contentType.includes('font') && !contentType.includes('octet-stream')) {
                        div.className = 'test error';
                        div.innerHTML += '<br><strong>⚠️ Warning:</strong> Content-Type suggests this is not a font file';
                    }
                } else {
                    div.className += ' error';
                    div.innerHTML = `
                        <strong>✗ ${type}:</strong> <code>${url}</code><br>
                        Status: ${response.status} ${response.statusText}
                    `;
                }
            } catch (error) {
                div.className += ' error';
                div.innerHTML = `
                    <strong>✗ ${type}:</strong> <code>${url}</code><br>
                    Error: ${error.message}
                `;
            }
            
            results.appendChild(div);
        }
        
        // Test all resources
        async function runTests() {
            // Test fonts
            await testResource('./fonts/ComicRelief-Regular.ttf', 'Font Regular');
            await testResource('./fonts/ComicRelief-Bold.ttf', 'Font Bold');
            
            // Test API endpoints
            await testResource('./api/sync/access_share.php', 'API access_share.php');
            await testResource('./api/sync/create_share.php', 'API create_share.php');
            await testResource('./api/sync/database.php', 'API database.php');
            
            // Test other resources
            await testResource('./service-worker.js', 'Service Worker');
            await testResource('./workbox-ff8f0705.js', 'Workbox');
            await testResource('./manifest.json', 'Manifest');
            
            // Test icons
            await testResource('./icons/icon-512.png', 'Icon 512px');
        }
        
        runTests();
    </script>
</body>
</html>
