<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Operation Tracking Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .log-output {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        .stat-card {
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Operation Tracking Integration Test</h1>
    
    <div class="test-section">
        <h2>Test Mutation Methods</h2>
        <p>Click buttons to test each mutation method and verify operation tracking</p>
        
        <h3>Activity Operations</h3>
        <button onclick="testAddActivity()">Add Activity</button>
        <button onclick="testUpdateActivity()">Update Activity</button>
        <button onclick="testRemoveActivity()">Remove Activity</button>
        <button onclick="testMoveActivity()">Move Activity</button>
        
        <h3>User Operations</h3>
        <button onclick="testAddUser()">Add User</button>
        <button onclick="testUpdateUser()">Update User</button>
        <button onclick="testSwitchUser()">Switch User</button>
        
        <h3>Bulk Operations</h3>
        <button onclick="testBulkOperations()">Test Multiple Operations</button>
        <button onclick="clearOperationLog()">Clear Operation Log</button>
    </div>
    
    <div class="test-section">
        <h2>Operation Log Stats</h2>
        <div id="stats" class="stats"></div>
    </div>
    
    <div class="test-section">
        <h2>Operation Log</h2>
        <button onclick="refreshLog()">Refresh Log</button>
        <button onclick="showUnsyncedOps()">Show Unsynced Operations</button>
        <button onclick="showDirtyState()">Show Dirty State</button>
        <div id="logOutput" class="log-output"></div>
    </div>

    <!-- Load dependencies -->
    <script src="config/constants.js"></script>
    <script src="config/defaults.js"></script>
    <script src="state.js"></script>
    
    <script>
        // Initialize AppState
        const appState = new AppState();
        let testActivityId = null;
        let testUserId = null;
        
        function log(message, isError = false) {
            const output = document.getElementById('logOutput');
            const timestamp = new Date().toLocaleTimeString();
            const className = isError ? 'error' : (message.includes('✓') ? 'success' : '');
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
        }
        
        function updateStats() {
            const stats = appState.getOperationLogStats();
            const statsDiv = document.getElementById('stats');
            
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <strong>Total Operations:</strong> ${stats.total}
                </div>
                <div class="stat-card">
                    <strong>Pending:</strong> ${stats.pending}
                </div>
                <div class="stat-card">
                    <strong>Synced:</strong> ${stats.synced}
                </div>
                <div class="stat-card">
                    <strong>Failed:</strong> ${stats.failed}
                </div>
                ${Object.entries(stats.byType).map(([type, count]) => `
                    <div class="stat-card">
                        <strong>${type}:</strong> ${count}
                    </div>
                `).join('')}
            `;
        }
        
        function testAddActivity() {
            try {
                log('Testing addActivity...');
                const beforeCount = appState._operationLog.length;
                
                appState.addActivity({
                    title: 'Test Activity ' + Date.now(),
                    description: 'Created for operation tracking test',
                    icon: '🧪',
                    cardType: 'recurring'
                });
                
                const afterCount = appState._operationLog.length;
                const lastOp = appState._operationLog[appState._operationLog.length - 1];
                
                if (afterCount === beforeCount + 1 && lastOp.type === 'add-activity') {
                    testActivityId = lastOp.data.activityId;
                    log(`✓ addActivity tracked successfully! Activity ID: ${testActivityId}`);
                    log('Operation data: ' + JSON.stringify(lastOp, null, 2));
                } else {
                    log('✗ addActivity tracking failed!', true);
                }
                
                updateStats();
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
        
        function testUpdateActivity() {
            try {
                log('Testing updateActivity...');
                const activities = appState.getCurrentActivities();
                if (activities.length === 0) {
                    log('No activities to update. Add one first!', true);
                    return;
                }
                
                const beforeCount = appState._operationLog.length;
                const index = 0;
                
                appState.updateActivity(index, {
                    title: 'Updated Activity ' + Date.now(),
                    completed: true
                });
                
                const afterCount = appState._operationLog.length;
                const lastOp = appState._operationLog[appState._operationLog.length - 1];
                
                if (afterCount === beforeCount + 1 && lastOp.type === 'update-activity') {
                    log('✓ updateActivity tracked successfully!');
                    log('Operation data: ' + JSON.stringify(lastOp, null, 2));
                } else {
                    log('✗ updateActivity tracking failed!', true);
                }
                
                updateStats();
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
        
        function testRemoveActivity() {
            try {
                log('Testing removeActivity...');
                const activities = appState.getCurrentActivities();
                if (activities.length === 0) {
                    log('No activities to remove. Add one first!', true);
                    return;
                }
                
                const beforeCount = appState._operationLog.length;
                const index = activities.length - 1;
                const activityToRemove = activities[index];
                
                appState.removeActivity(index);
                
                const afterCount = appState._operationLog.length;
                const lastOp = appState._operationLog[appState._operationLog.length - 1];
                
                if (afterCount === beforeCount + 1 && lastOp.type === 'remove-activity') {
                    log('✓ removeActivity tracked successfully!');
                    log('Removed activity: ' + activityToRemove.title);
                    log('Operation data: ' + JSON.stringify(lastOp, null, 2));
                } else {
                    log('✗ removeActivity tracking failed!', true);
                }
                
                updateStats();
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
        
        function testMoveActivity() {
            try {
                log('Testing moveActivity...');
                const activities = appState.getCurrentActivities();
                if (activities.length < 2) {
                    log('Need at least 2 activities to test move. Add more!', true);
                    return;
                }
                
                const beforeCount = appState._operationLog.length;
                
                appState.moveActivity(0, 1);
                
                const afterCount = appState._operationLog.length;
                const lastOp = appState._operationLog[appState._operationLog.length - 1];
                
                if (afterCount === beforeCount + 1 && lastOp.type === 'move-activity') {
                    log('✓ moveActivity tracked successfully!');
                    log('Operation data: ' + JSON.stringify(lastOp, null, 2));
                } else {
                    log('✗ moveActivity tracking failed!', true);
                }
                
                updateStats();
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
        
        function testAddUser() {
            try {
                log('Testing addUser...');
                const beforeCount = appState._operationLog.length;
                
                testUserId = appState.addUser('Test User ' + Date.now().toString(36), '🧑‍🔬');
                
                const afterCount = appState._operationLog.length;
                const lastOp = appState._operationLog[appState._operationLog.length - 1];
                
                if (afterCount === beforeCount + 1 && lastOp.type === 'add-user') {
                    log(`✓ addUser tracked successfully! User ID: ${testUserId}`);
                    log('Operation data: ' + JSON.stringify(lastOp, null, 2));
                } else {
                    log('✗ addUser tracking failed!', true);
                }
                
                updateStats();
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
        
        function testUpdateUser() {
            try {
                log('Testing updateUser...');
                const userIds = Object.keys(appState.users.profiles);
                if (userIds.length === 0) {
                    log('No users to update!', true);
                    return;
                }
                
                const beforeCount = appState._operationLog.length;
                const userId = userIds[userIds.length - 1];
                
                appState.updateUser(userId, {
                    name: 'Updated User ' + Date.now().toString(36),
                    icon: '🔬'
                });
                
                const afterCount = appState._operationLog.length;
                const lastOp = appState._operationLog[appState._operationLog.length - 1];
                
                if (afterCount === beforeCount + 1 && lastOp.type === 'update-user') {
                    log('✓ updateUser tracked successfully!');
                    log('Operation data: ' + JSON.stringify(lastOp, null, 2));
                } else {
                    log('✗ updateUser tracking failed!', true);
                }
                
                updateStats();
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
        
        function testSwitchUser() {
            try {
                log('Testing switchUser...');
                const userIds = Object.keys(appState.users.profiles);
                if (userIds.length < 2) {
                    log('Need at least 2 users to test switch. Add more!', true);
                    return;
                }
                
                const beforeCount = appState._operationLog.length;
                const currentUserId = appState.users.currentUserId;
                const targetUserId = userIds.find(id => id !== currentUserId);
                
                appState.switchUser(targetUserId);
                
                const afterCount = appState._operationLog.length;
                const lastOp = appState._operationLog[appState._operationLog.length - 1];
                
                if (afterCount === beforeCount + 1 && lastOp.type === 'switch-user') {
                    log('✓ switchUser tracked successfully!');
                    log('Operation data: ' + JSON.stringify(lastOp, null, 2));
                } else {
                    log('✗ switchUser tracking failed!', true);
                }
                
                updateStats();
            } catch (error) {
                log('Error: ' + error.message, true);
            }
        }
        
        function testBulkOperations() {
            log('Testing bulk operations...');
            const startCount = appState._operationLog.length;
            
            try {
                // Add multiple activities
                for (let i = 0; i < 5; i++) {
                    appState.addActivity({
                        title: `Bulk Activity ${i + 1}`,
                        icon: '📦'
                    });
                }
                
                // Update some
                appState.updateActivity(0, { completed: true });
                appState.updateActivity(1, { completed: true });
                
                // Move one
                if (appState.getCurrentActivities().length >= 3) {
                    appState.moveActivity(2, 0);
                }
                
                const endCount = appState._operationLog.length;
                const addedOps = endCount - startCount;
                
                log(`✓ Bulk operations completed! Added ${addedOps} operations to the log`);
                
                // Check dirty state
                log('Dirty state: ' + (appState.isDirty() ? 'YES' : 'NO'));
                
                updateStats();
            } catch (error) {
                log('Error in bulk operations: ' + error.message, true);
            }
        }
        
        function refreshLog() {
            const ops = appState.getOperationLog();
            log(`\n=== Full Operation Log (${ops.length} operations) ===`);
            ops.forEach((op, index) => {
                log(`${index + 1}. ${op.type} [${op.syncStatus}] - ${new Date(op.timestamp).toLocaleTimeString()}`);
            });
            updateStats();
        }
        
        function showUnsyncedOps() {
            const unsynced = appState._getUnsyncedOperations();
            log(`\n=== Unsynced Operations (${unsynced.length}) ===`);
            unsynced.forEach((op, index) => {
                log(`${index + 1}. ${op.type} - ${JSON.stringify(op.data)}`);
            });
        }
        
        function showDirtyState() {
            log('\n=== Dirty State ===');
            log('Is Dirty: ' + (appState.isDirty() ? 'YES' : 'NO'));
            log('Dirty Users: ' + Array.from(appState._dirtyUsers).join(', '));
            
            const dirtyActivities = {};
            appState._dirtyActivities.forEach((activities, userId) => {
                dirtyActivities[userId] = Array.from(activities);
            });
            log('Dirty Activities: ' + JSON.stringify(dirtyActivities, null, 2));
            
            const changedData = appState.getChangedData();
            log('Changed Data: ' + JSON.stringify(changedData, null, 2));
        }
        
        function clearOperationLog() {
            if (confirm('Clear the entire operation log?')) {
                appState.resetOperationLog();
                log('✓ Operation log cleared!');
                updateStats();
            }
        }
        
        // Initial setup
        window.onload = function() {
            log('Operation Tracking Test Page Ready');
            log('AppState initialized with ' + Object.keys(appState.users.profiles).length + ' users');
            updateStats();
        };
    </script>
</body>
</html>
