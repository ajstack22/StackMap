<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Attachments Test</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/photo-attachments.css">
    <style>
        body {
            padding: 20px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .task-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status {
            padding: 10px;
            margin-top: 20px;
            border-radius: 4px;
            font-family: monospace;
        }
        .status.success {
            background: #2d5a2d;
            color: #90ee90;
        }
        .status.error {
            background: #5a2d2d;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Photo Attachments Test</h1>
        
        <div class="task-card">
            <h2>Task: Test Photo Feature</h2>
            <div id="photo-container-1"></div>
        </div>

        <div class="task-card">
            <h2>Task: Another Task</h2>
            <div id="photo-container-2"></div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <!-- Scripts -->
    <script src="js/photo-attachment-storage.js"></script>
    <script src="js/photo-attachment-ui.js"></script>
    
    <script>
    // Test script
    (function() {
        'use strict';
        
        var status = document.getElementById('status');
        var errorCount = 0;
        var messages = [];
        
        // Monitor console errors
        window.addEventListener('error', function(e) {
            errorCount++;
            messages.push('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
            updateStatus();
        });
        
        function updateStatus() {
            if (errorCount === 0) {
                status.className = 'status success';
                status.innerHTML = '<strong>✓ Success!</strong> No console errors detected.<br>' +
                                 'Photo attachment system initialized successfully.';
            } else {
                status.className = 'status error';
                status.innerHTML = '<strong>✗ Errors Found (' + errorCount + ')</strong><br>' +
                                 messages.join('<br>');
            }
        }
        
        // Initialize photo attachments
        window.addEventListener('load', function() {
            try {
                // Create storage instance
                var storage = new window.PhotoAttachmentStorage();
                
                // Wait for DB to initialize
                setTimeout(function() {
                    // Create UI instance
                    var photoUI = new window.PhotoAttachmentUI(storage);
                    
                    // Create attachment UI for test tasks
                    photoUI.createAttachmentUI('task-1', document.getElementById('photo-container-1'));
                    photoUI.createAttachmentUI('task-2', document.getElementById('photo-container-2'));
                    
                    messages.push('Photo UI initialized for 2 tasks');
                    updateStatus();
                }, 100);
                
            } catch (e) {
                errorCount++;
                messages.push('INIT ERROR: ' + e.message);
                updateStatus();
            }
        });
        
        // Initial status
        updateStatus();
    })();
    </script>
</body>
</html>
