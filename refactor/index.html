<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- RSD-Safe Error Interception - MUST load first -->
    <script src="js/rsd-safe-init.js"></script>
    <script>
    // Pre-boot safety check - redirects to static fallback if JS environment is broken
    (function() {
        var timeout = setTimeout(function() {
            window.location.replace('emergency-static.html');
        }, 50);
        
        try {
            // Test basic JavaScript
            var test = function() { return true; };
            if (!test()) throw new Error();
            
            // Test DOM APIs
            if (!document.querySelector) throw new Error();
            if (!window.addEventListener) throw new Error();
            
            // Test Array methods
            if (!Array.prototype.forEach) throw new Error();
            if (!Array.prototype.slice) throw new Error();
            if (!Array.from) throw new Error();
            
            // Test JSON
            if (!window.JSON || !JSON.parse || !JSON.stringify) throw new Error();
            
            // Test localStorage last (most likely to fail)
            var storage = window.localStorage;
            var testKey = '__sm_test_' + new Date().getTime();
            storage.setItem(testKey, '1');
            storage.removeItem(testKey);
            
            clearTimeout(timeout);
            
        } catch (e) {
            clearTimeout(timeout);
            window.location.replace('emergency-static.html');
        }
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StackMap</title>
    
    <!-- Critical inline styles for instant render -->
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        /* View system */
        .view {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .view.hidden {
            display: none;
        }
        
        .view.sliding-out {
            opacity: 0;
            transform: translateX(-20px);
        }
        
        .view.sliding-in {
            opacity: 0;
            transform: translateX(20px);
        }
        
        /* Header */
        .header {
            background: #2a2a2a;
            padding: env(safe-area-inset-top) 16px 16px 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
        }
        
        /* Content area */
        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }
        
        /* Loading state */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        /* Platform-specific styles */
        .platform-ios .header {
            backdrop-filter: blur(10px);
            background: rgba(42, 42, 42, 0.9);
        }
        
        .platform-tv {
            font-size: 125%;
        }
        
        .platform-tv *:focus {
            outline: 4px solid #667eea;
            outline-offset: 2px;
        }
        
        /* Phase 4: Error fallback styles */
        .component-fallback {
            display: none;
            padding: 20px;
            text-align: center;
        }
        
        .component-normal {
            display: block;
        }
        
        /* When error is active, swap visibility */
        .component-error-active .component-normal {
            display: none;
        }
        
        .component-error-active .component-fallback {
            display: block;
        }
        
        /* Fallback UI styling */
        .fallback-message {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .fallback-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 300px;
            margin: 0 auto;
        }
        
        .fallback-button {
            min-height: 44px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .fallback-button-primary {
            background: #5a6c40; /* Research-based calming green, 6.9:1 contrast */
            color: #ffffff;
        }
        
        .fallback-button-secondary {
            background: #0c96e4; /* Research-based soft blue */
            color: #ffffff;
        }
        
        /* Link styling to match button appearance */
        a.fallback-button {
            text-decoration: none;
            display: block;
            text-align: center;
        }
        
        /* Focus management for fallback */
        .component-fallback:focus {
            outline: none;
        }
        
        .component-fallback:focus-within .fallback-button:focus {
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }
    </style>
    
    <!-- External styles loaded async -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="css/tv.css" media="(min-width: 1920px)">
    
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="js/app.js" as="script">
</head>
<body>
    <!-- Loading State -->
    <div id="loading-view" class="view">
        <div class="loading">
            <h1>StackMap</h1>
            <p>Loading...</p>
        </div>
    </div>
    
    <!-- Main App View -->
    <div id="main-view" class="view hidden">
        <header class="header">
            <h1>StackMap</h1>
            <button id="menu-button" aria-label="Menu">☰</button>
        </header>
        <main class="content">
            <!-- Normal content wrapper -->
            <div class="component-normal">
                <!-- Task cards will be dynamically inserted here -->
                <div id="task-container"></div>
            </div>
            
            <!-- Fallback UI (hidden by default, shown via CSS when .component-error-active is added) -->
            <div class="component-fallback" role="alert" aria-live="assertive" tabindex="-1">
                <div class="fallback-message">Taking a moment to get things ready</div>
                <div class="fallback-actions">
                    <!-- Form-based try again for zero-JS functionality -->
                    <form method="get" action="index.html" style="margin: 0;">
                        <input type="hidden" name="last-task" id="last-task" value="">
                        <button type="submit" class="fallback-button fallback-button-primary">Try again</button>
                    </form>
                    <!-- Simple anchor link for safe mode -->
                    <a href="index.html?safe=true" class="fallback-button fallback-button-secondary">Use simple mode</a>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Settings View -->
    <div id="settings-view" class="view hidden">
        <header class="header">
            <button id="settings-back" aria-label="Back">←</button>
            <h1>Settings</h1>
            <div style="width: 44px;"></div>
        </header>
        <main class="content">
            <section>
                <h2>Preferences</h2>
                <!-- Settings content -->
            </section>
            <section>
                <h2>About</h2>
                <nav>
                    <a href="#privacy">Privacy Policy</a>
                    <a href="#terms">Terms of Service</a>
                    <a href="#support">Support StackMap</a>
                </nav>
            </section>
        </main>
    </div>
    
    <!-- Privacy View -->
    <div id="privacy-view" class="view hidden">
        <header class="header">
            <button id="privacy-back" aria-label="Back">←</button>
            <h1>Privacy Policy</h1>
            <div style="width: 44px;"></div>
        </header>
        <main class="content">
            <!-- Privacy content will be loaded here -->
        </main>
    </div>
    
    <!-- Terms View -->
    <div id="terms-view" class="view hidden">
        <header class="header">
            <button id="terms-back" aria-label="Back">←</button>
            <h1>Terms of Service</h1>
            <div style="width: 44px;"></div>
        </header>
        <main class="content">
            <!-- Terms content will be loaded here -->
        </main>
    </div>
    
    <!-- Support View -->
    <div id="support-view" class="view hidden">
        <header class="header">
            <button id="support-back" aria-label="Back">←</button>
            <h1>Support StackMap</h1>
            <div style="width: 44px;"></div>
        </header>
        <main class="content">
            <!-- Support content will be loaded here -->
        </main>
    </div>
    
    <!-- Core Scripts -->
    <script>
        // Immediate platform detection for styling
        (function() {
            var ua = navigator.userAgent;
            var classes = [];
            
            if (window.Capacitor) {
                classes.push('platform-capacitor');
                var platform = Capacitor.getPlatform();
                if (platform) classes.push('platform-' + platform);
            } else if (window.matchMedia('(display-mode: standalone)').matches) {
                classes.push('platform-pwa');
            } else {
                classes.push('platform-web');
            }
            
            if (ua.includes('TV') || window.innerWidth > 1920) {
                classes.push('platform-tv');
            }
            
            document.body.className = classes.join(' ');
        })();
    </script>
    
    <!-- Messaging system -->
    <script src="js/messaging.js" defer></script>
    <!-- SQLite storage -->
    <script src="js/task-sqlite.js" defer></script>
    <!-- Main application -->
    <script src="js/app.js" defer></script>
</body>
</html>
