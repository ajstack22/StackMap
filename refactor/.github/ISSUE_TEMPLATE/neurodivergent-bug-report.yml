name: Neurodivergent Accessibility Bug Report
description: Report an accessibility issue that affects neurodivergent users
title: "[A11Y] "
labels: ["accessibility", "neurodivergent", "bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us make StackMap more accessible for neurodivergent users. Your feedback is invaluable.
        
  - type: dropdown
    id: user-profile
    attributes:
      label: Which user profile best describes your experience?
      description: This helps us understand the context (you can select multiple)
      multiple: true
      options:
        - ADHD
        - Autism/ASD
        - Dyslexia
        - Anxiety
        - Sensory Processing Differences
        - Multiple/Other neurodivergent conditions
        - Neurotypical ally/tester
        - Prefer not to say
    validations:
      required: true
      
  - type: dropdown
    id: issue-category
    attributes:
      label: What type of issue are you experiencing?
      multiple: true
      options:
        - Sensory overload (colors, animations, sounds)
        - Navigation confusion
        - Working memory challenges
        - Focus/attention difficulties
        - Time blindness issues
        - Executive function barriers
        - Communication/instruction clarity
        - Anxiety-inducing patterns
        - Physical discomfort (motion sickness, eye strain)
        - Other cognitive accessibility issue
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: |
        Please describe what happened and how it affected your experience.
        There's no "wrong" way to describe this - use whatever words feel right.
      placeholder: |
        Example: "When I open the task list, all the items animate in at once. 
        This makes me feel overwhelmed and I have to look away from the screen."
    validations:
      required: true
      
  - type: textarea
    id: impact
    attributes:
      label: How does this impact your use of the app?
      description: Help us understand the severity from your perspective
      placeholder: |
        Example: "I have to close the app and come back later" or 
        "I can work around it but it slows me down significantly"
    validations:
      required: true
      
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Most of the time
        - Sometimes
        - Only in specific situations
    validations:
      required: true
      
  - type: textarea
    id: trigger-context
    attributes:
      label: When does this happen?
      description: |
        Help us understand the context or triggers
      placeholder: |
        Examples:
        - "After using the app for more than 10 minutes"
        - "When switching between light and dark mode"
        - "During morning hours when I'm most sensitive"
        - "When there are more than 5 tasks visible"
        
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (if any)
      description: Have you found any way to make it more manageable?
      placeholder: |
        Example: "I zoom in to 150% so I can only see 2-3 items at once"
    validations:
      required: false
      
  - type: textarea
    id: suggestions
    attributes:
      label: Suggested improvements
      description: |
        What would make this better for you? 
        Don't worry about technical feasibility - dream big!
      placeholder: |
        Example: "An option to turn off all animations" or
        "A 'calm mode' that makes everything slower and quieter"
    validations:
      required: false
      
  - type: dropdown
    id: device
    attributes:
      label: Device type
      multiple: true
      options:
        - Android phone
        - Android tablet
        - iPhone
        - iPad
        - Chromebook
        - Windows laptop/desktop
        - Mac
        - TV (Android TV, Apple TV, etc.)
        - Other
    validations:
      required: true
      
  - type: input
    id: version
    attributes:
      label: App version
      description: Found in Settings > About
      placeholder: "1.2.3"
    validations:
      required: false
      
  - type: dropdown
    id: severity
    attributes:
      label: Personal severity rating
      description: How severe is this issue for you personally?
      options:
        - Blocking - I cannot use the app at all
        - Severe - Major features are inaccessible to me
        - Moderate - I can work around it but it's difficult
        - Minor - Small annoyance but manageable
    validations:
      required: true
      
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I'm okay with the team reaching out for more details if needed
          required: false
        - label: I'd like to be notified when this is fixed
          required: false
          
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: |
        Anything else that might help us understand and fix this issue?
        Screenshots, videos, or specific examples are always helpful but never required.
      placeholder: |
        This is a safe space to share whatever context feels relevant to your experience.