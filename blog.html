<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackMap Development Blog - AI-Assisted Journey</title>
    
    <!-- Use existing StackMap CSS variables -->
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="blog/blog-styles.css">
    
    <!-- PWA capabilities -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
</head>
<body>
    <!-- Header consistent with main app -->
    <header class="blog-header">
        <div class="blog-header-content">
            <h1>StackMap Development Journey</h1>
            <p>Real-time documentation of AI-assisted special needs app development</p>
            <nav class="blog-nav">
                <a href="/" class="nav-link">← Back to StackMap</a>
                <a href="#timeline" class="nav-link">Timeline</a>
                <a href="#innovations" class="nav-link">Innovations</a>
                <a href="#solutions" class="nav-link">Solutions</a>
            </nav>
        </div>
    </header>

    <!-- Main content areas -->
    <main class="blog-main">
        <!-- Live development status -->
        <section id="live-status" class="status-section">
            <h2>🔴 Live Development Status</h2>
            <div id="current-session" class="current-session-container"></div>
        </section>

        <!-- Development timeline -->
        <section id="timeline" class="timeline-section">
            <h2>📅 Development Timeline</h2>
            <div id="session-timeline" class="session-timeline-container"></div>
        </section>

        <!-- Technical innovations -->
        <section id="innovations" class="innovations-section">
            <h2>💡 Technical Innovations</h2>
            <div id="innovation-grid" class="innovation-grid-container"></div>
        </section>

        <!-- Problem-solution database -->
        <section id="solutions" class="solutions-section">
            <h2>🔧 Problem-Solution Database</h2>
            <div class="solution-search">
                <input type="text" id="solution-search" placeholder="Search problems or solutions..." class="search-input">
            </div>
            <div id="solutions-grid" class="solutions-grid-container"></div>
        </section>

        <!-- AI collaboration highlights -->
        <section id="ai-collaboration" class="collaboration-section">
            <h2>🤖 AI Collaboration Patterns</h2>
            <div id="collaboration-examples" class="collaboration-container"></div>
        </section>
    </main>

    <!-- Footer with metrics -->
    <footer class="blog-footer">
        <div id="metrics-summary" class="metrics-container"></div>
    </footer>

    <!-- Scripts using StackMap pattern -->
    <script src="blog/blog-data.js"></script>
    <script src="blog/blog-renderer.js"></script>
    <script>
        // Initialize blog on load
        document.addEventListener('DOMContentLoaded', () => {
            window.StackMapBlogRenderer.init();
        });
    </script>
</body>
</html>
