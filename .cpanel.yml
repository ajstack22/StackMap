---
deployment:
  branch: main
  tasks:
    - export DEPLOYPATH=/home/stachblx/public_html/qual
    # Clear the deployment directory first (except hidden files)
    - /bin/rm -rf $DEPLOYPATH/*
    # Copy only the web build files
    - /bin/cp -R web/build/* $DEPLOYPATH/
    # Set proper permissions
    - find $DEPLOYPATH -type f -exec chmod 644 {} \;
    - find $DEPLOYPATH -type d -exec chmod 755 {} \;