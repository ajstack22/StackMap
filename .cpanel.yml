---
deployment:
  tasks:
    - export DEPLOYPATH=/home/stachblx/public_html/qual
    # Remove all non-hidden files and directories from deployment path
    - /bin/rm -rf $DEPLOYPATH/*
    # Copy only the contents of web/build to the deployment path
    - /bin/cp -R ./web/build/* $DEPLOYPATH/
    - /bin/cp ./web/build/.htaccess $DEPLOYPATH/ 2>/dev/null || true
    # Set proper permissions
    - /bin/find $DEPLOYPATH -type f -exec chmod 644 {} \;
    - /bin/find $DEPLOYPATH -type d -exec chmod 755 {} \;