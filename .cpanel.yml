---
deployment:
  tasks:
    - export DEPLOYPATH=/home/stachblx/public_html/qual
    # Copy web build files directly to qual root
    - /bin/cp -f ./web/build/*.js $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp -f ./web/build/*.html $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp -f ./web/build/*.png $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp -f ./web/build/*.txt $DEPLOYPATH/ 2>/dev/null || true
    # Copy fonts directory if it exists
    - /bin/cp -rf ./web/build/fonts $DEPLOYPATH/ 2>/dev/null || true
    # Set proper permissions
    - /bin/find $DEPLOYPATH -type f -exec chmod 644 {} \;
    - /bin/find $DEPLOYPATH -type d -exec chmod 755 {} \;
    # Log deployment for debugging
    - echo "Deployment completed at $(date)" >> $DEPLOYPATH/deploy.log