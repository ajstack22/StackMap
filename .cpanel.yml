---
deployment:
  tasks:
    - export DEPLOYPATH=/home/stachblx/public_html/qual
    - export REPOPATH=/home/stachblx/repositories/StackMap
    # Remove old bundle files to ensure clean deployment
    - /bin/rm -f $DEPLOYPATH/bundle.*.js
    - /bin/rm -f $DEPLOYPATH/bundle.*.js.LICENSE.txt
    # Copy web build files directly to qual root using absolute paths
    - /bin/cp -f $REPOPATH/web/build/*.js $DEPLOYPATH/
    - /bin/cp -f $REPOPATH/web/build/*.html $DEPLOYPATH/
    - /bin/cp -f $REPOPATH/web/build/*.png $DEPLOYPATH/
    - /bin/cp -f $REPOPATH/web/build/*.txt $DEPLOYPATH/
    - /bin/cp -f $REPOPATH/web/build/*.json $DEPLOYPATH/
    # Copy fonts directory if it exists
    - /bin/cp -rf $REPOPATH/web/build/fonts $DEPLOYPATH/
    # Copy icons directory for PWA
    - /bin/cp -rf $REPOPATH/web/build/icons $DEPLOYPATH/
    # List files for debugging
    - /bin/ls -la $DEPLOYPATH/ >> $DEPLOYPATH/deploy.log
    # Log deployment for debugging
    - echo "=== Deployment started at $(date) ===" >> $DEPLOYPATH/deploy.log
    - echo "Deployment completed at $(date)" >> $DEPLOYPATH/deploy.log