---
deployment:
  tasks:
    - export DEPLOYPATH=/home/stachblx/public_html/stackmap.app
    - /bin/cp -R . $DEPLOYPATH
    - /bin/rm -rf $DEPLOYPATH/.git
    - /bin/rm -rf $DEPLOYPATH/.cpanel.yml
    - /bin/rm -rf $DEPLOYPATH/docs
    - /bin/rm -rf $DEPLOYPATH/Screenshots
    - /bin/rm -f $DEPLOYPATH/README.md
    - /bin/rm -f $DEPLOYPATH/LICENSE
    - /bin/rm -f $DEPLOYPATH/CONTRIBUTING.md
    - /bin/rm -f $DEPLOYPATH/SECURITY.md
    - /bin/rm -f $DEPLOYPATH/DEPLOYMENT_GUIDE.md
    - /bin/rm -f $DEPLOYPATH/deploy-checklist.txt
    - /bin/rm -f $DEPLOYPATH/.gitignore
    - /bin/rm -f $DEPLOYPATH/.env.example
    - find $DEPLOYPATH -type f -exec chmod 644 {} \;
    - find $DEPLOYPATH -type d -exec chmod 755 {} \;