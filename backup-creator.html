<!DOCTYPE html>
<html>
<head>
    <title>StackMap Backup Creator</title>
</head>
<body>
    <h1>StackMap Emergency Backup</h1>
    <button id="createBackup">Create Backup</button>
    <pre id="output"></pre>
    
    <script>
        document.getElementById('createBackup').addEventListener('click', () => {
            const backup = {
                timestamp: new Date().toISOString(),
                version: 'pre-modularization',
                stackmap_data_v3: localStorage.getItem('stackmap_data_v3'),
                stackmap_theme_color: localStorage.getItem('stackmap_theme_color'),
                stackmap_display_mode: localStorage.getItem('stackmap_display_mode'),
                all_keys: Object.keys(localStorage).reduce((acc, key) => {
                    acc[key] = localStorage.getItem(key);
                    return acc;
                }, {})
            };
            
            // Save to localStorage
            localStorage.setItem('stackmap_emergency_backup_' + Date.now(), JSON.stringify(backup));
            
            // Create downloadable file
            const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'stackmap-backup-' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            
            // Show in console and page
            console.log('BACKUP CREATED:', backup);
            document.getElementById('output').textContent = JSON.stringify(backup, null, 2);
            
            alert('Backup created! Check downloads and console.');
        });
    </script>
</body>
</html>
