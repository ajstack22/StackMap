<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackMap - Offline</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #667eea 0%, #4a5bc7 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        p {
            font-size: 1.2rem;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="80" height="80">
            <circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
            <rect x="7" y="10" width="18" height="2.5" fill="#4a90e2" rx="1.25"/>
            <rect x="7" y="14.5" width="18" height="2.5" fill="#4a90e2" rx="1.25"/>
            <rect x="7" y="19" width="18" height="5" fill="#2c5aa0" rx="2.5"/>
        </svg>
    </div>
    
    <div class="offline-icon">📱</div>
    <h1>You're Offline</h1>
    <p>Don't worry! Your StackMap routines are still available. The app works offline so your daily activities are always accessible.</p>
    
    <button class="btn" onclick="window.location.reload()">
        Try Again
    </button>
    
    <script>
        // Auto-retry when connection restored
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
