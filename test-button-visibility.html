<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Visibility Test</title>
    <script>
        function testButtons() {
            const prefBtn = document.getElementById('preferencesBtn');
            const grownupBtn = document.getElementById('grownupBtn');
            const header = document.querySelector('.app-header');
            const output = document.getElementById('output');
            
            let results = [];
            
            // Test button existence
            results.push(`Preferences button exists: ${!!prefBtn}`);
            results.push(`Grownup button exists: ${!!grownupBtn}`);
            results.push(`App header exists: ${!!header}`);
            
            if (prefBtn) {
                const styles = window.getComputedStyle(prefBtn);
                results.push('\nPreferences Button Styles:');
                results.push(`  Position: ${styles.position}`);
                results.push(`  Top: ${styles.top}`);
                results.push(`  Left: ${styles.left}`);
                results.push(`  Z-index: ${styles.zIndex}`);
                results.push(`  Display: ${styles.display}`);
                results.push(`  Visibility: ${styles.visibility}`);
                results.push(`  Opacity: ${styles.opacity}`);
                
                const rect = prefBtn.getBoundingClientRect();
                results.push(`  Actual position: top=${rect.top}, left=${rect.left}`);
            }
            
            if (grownupBtn) {
                const styles = window.getComputedStyle(grownupBtn);
                results.push('\nGrownup Button Styles:');
                results.push(`  Position: ${styles.position}`);
                results.push(`  Top: ${styles.top}`);
                results.push(`  Right: ${styles.right}`);
                results.push(`  Z-index: ${styles.zIndex}`);
                results.push(`  Display: ${styles.display}`);
                results.push(`  Visibility: ${styles.visibility}`);
                results.push(`  Opacity: ${styles.opacity}`);
                
                const rect = grownupBtn.getBoundingClientRect();
                results.push(`  Actual position: top=${rect.top}, right=${window.innerWidth - rect.right}`);
            }
            
            if (header) {
                const headerStyles = window.getComputedStyle(header);
                results.push('\nHeader Styles:');
                results.push(`  Z-index: ${headerStyles.zIndex}`);
                results.push(`  Overflow: ${headerStyles.overflow}`);
                
                const headerRect = header.getBoundingClientRect();
                results.push(`  Header height: ${headerRect.height}px`);
            }
            
            output.textContent = results.join('\n');
        }
    </script>
</head>
<body>
    <h1>Button Visibility Test</h1>
    <button onclick="testButtons()">Test Button Visibility</button>
    <button onclick="window.open('index.html', '_blank')">Open StackMap</button>
    <pre id="output" style="margin-top: 20px; padding: 20px; background: #f5f5f5; border-radius: 8px;"></pre>
</body>
</html>
