<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Modal Issues</title>
    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Debug Modal Issues</h1>
        
        <div id="modernUserContainer" style="margin: 20px 0;"></div>
        <div id="modernDayContainer" style="margin: 20px 0;"></div>
        
        <div style="margin-top: 40px; padding: 20px; background: #f0f0f0; border-radius: 8px;">
            <h2>Console Output</h2>
            <pre id="console-output" style="background: white; padding: 10px; border-radius: 4px; max-height: 400px; overflow-y: auto;"></pre>
        </div>
    </div>

    <!-- Load dependencies -->
    <script src="data/emoji-list.js"></script>
    <script src="data/emoji-names.js"></script>
    <script src="config/constants.js"></script>
    <script src="config/themes.js"></script>
    <script src="components.js"></script>
    <script src="state.js"></script>
    <script src="app/PreferencesManager.js"></script>
    <script src="app/StackMapApp.js"></script>
    <script src="components/ModernUserSelector.js"></script>
    <script src="components/ModernDaySelector.js"></script>
    
    <script>
        // Override console.log to display in the page
        const originalLog = console.log;
        const output = document.getElementById('console-output');
        console.log = function(...args) {
            originalLog(...args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            output.textContent += message + '\n';
            output.scrollTop = output.scrollHeight;
        };

        // Initialize app with grownup mode
        const appState = new AppState();
        const app = {
            grownupMode: true,
            appState: appState,
            showAddUserDialog: function() {
                console.log('App showAddUserDialog called');
                ComponentBuilder.showAddUserModal();
            },
            switchDay: function(day) {
                console.log('Switching to day:', day);
                appState.setCurrentDay(day);
            },
            getDayCounts: function() {
                return { today: 5, tomorrow: 3 };
            },
            showCompleteDayConfirmation: function() {
                console.log('Complete day confirmation requested');
            }
        };
        
        // Add some test users
        appState.users.users = [
            { id: '1', name: 'Test User 1', avatar: '😊', activities: [], tomorrowActivities: [] },
            { id: '2', name: 'Test User 2', avatar: '🎨', activities: [], tomorrowActivities: [] }
        ];
        appState.users.currentUserId = '1';
        
        // Create modern selectors
        console.log('Creating modern user selector...');
        const userSelector = new ModernUserSelector(
            document.getElementById('modernUserContainer'), 
            app
        );
        
        console.log('Creating modern day selector...');
        const daySelector = new ModernDaySelector(
            document.getElementById('modernDayContainer'),
            app
        );
        
        console.log('Selectors created. Try clicking on them!');
    </script>
</body>
</html>
