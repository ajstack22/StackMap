<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Initial Sync - StackMap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .test-button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .test-button:hover {
            background: #45a049;
        }
        .log-output {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>StackMap Initial Sync Test</h1>
    
    <div class="test-section">
        <h2>Test Scenarios</h2>
        <button class="test-button" onclick="testNoAuth()">Test 1: No Authentication</button>
        <button class="test-button" onclick="testWithAuth()">Test 2: With Authentication</button>
        <button class="test-button" onclick="testConflictResolution()">Test 3: Conflict Resolution</button>
        <button class="test-button" onclick="testLargeDataSync()">Test 4: Large Data Sync</button>
        <button class="test-button" onclick="clearLocalData()">Clear Local Data</button>
        <button class="test-button" onclick="clearSyncStatus()">Clear Sync Status</button>
    </div>
    
    <div class="test-section">
        <h2>Current Status</h2>
        <div id="currentStatus" class="status info">Not initialized</div>
    </div>
    
    <div class="test-section">
        <h2>Log Output</h2>
        <div id="logOutput" class="log-output"></div>
    </div>
    
    <script>
        const logOutput = document.getElementById('logOutput');
        const currentStatus = document.getElementById('currentStatus');
        
        // Override console.log to capture output
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            logOutput.textContent += message + '\n';
            logOutput.scrollTop = logOutput.scrollHeight;
        };
        
        function updateStatus(message, type = 'info') {
            currentStatus.textContent = message;
            currentStatus.className = `status ${type}`;
        }
        
        function testNoAuth() {
            logOutput.textContent = '';
            updateStatus('Testing without authentication...', 'info');
            
            // Clear any existing auth
            localStorage.removeItem('stackmap-google-token');
            
            // Simulate app initialization
            console.log('=== TEST: No Authentication ===');
            console.log('Expected behavior: App should load immediately without waiting for sync');
            
            // Check sync status
            const syncStatus = localStorage.getItem('stackmap-last-sync-status');
            console.log('Current sync status:', syncStatus);
            
            updateStatus('Test complete - check logs', 'success');
        }
        
        function testWithAuth() {
            logOutput.textContent = '';
            updateStatus('Testing with authentication...', 'info');
            
            console.log('=== TEST: With Authentication ===');
            console.log('This test requires manual sign-in to Google Drive');
            console.log('Expected behavior:');
            console.log('1. Loading overlay should appear');
            console.log('2. Data should sync automatically');
            console.log('3. App becomes interactive after sync completes');
            
            updateStatus('Please sign in to Google Drive in the main app to test', 'info');
        }
        
        function testConflictResolution() {
            logOutput.textContent = '';
            updateStatus('Testing conflict resolution...', 'info');
            
            console.log('=== TEST: Conflict Resolution ===');
            
            // Simulate local data with version
            const localData = {
                version: "1.0.0",
                syncMetadata: {
                    version: 5,
                    lastModified: new Date(Date.now() - 3600000).toISOString(), // 1 hour ago
                    deviceId: "test-device-1",
                    deviceName: "Test Device 1"
                },
                users: {
                    profiles: {
                        "user1": {
                            name: "Test User",
                            activities: [
                                { title: "Local Activity 1", completed: false },
                                { title: "Local Activity 2", completed: true }
                            ]
                        }
                    }
                }
            };
            
            console.log('Local data version:', localData.syncMetadata.version);
            console.log('Local last modified:', localData.syncMetadata.lastModified);
            
            // Simulate remote data
            const remoteData = {
                version: "1.0.0",
                syncMetadata: {
                    version: 5,
                    lastModified: new Date().toISOString(), // Now
                    deviceId: "test-device-2",
                    deviceName: "Test Device 2"
                },
                users: {
                    profiles: {
                        "user1": {
                            name: "Test User",
                            activities: [
                                { title: "Remote Activity 1", completed: false },
                                { title: "Remote Activity 2", completed: false },
                                { title: "Remote Activity 3", completed: true }
                            ]
                        }
                    }
                }
            };
            
            console.log('Remote data version:', remoteData.syncMetadata.version);
            console.log('Remote last modified:', remoteData.syncMetadata.lastModified);
            console.log('Expected: Should detect same version but different timestamps');
            
            updateStatus('Conflict scenario simulated - check logs', 'success');
        }
        
        function testLargeDataSync() {
            logOutput.textContent = '';
            updateStatus('Testing large data sync...', 'info');
            
            console.log('=== TEST: Large Data Sync ===');
            
            // Generate large dataset
            const largeData = {
                version: "1.0.0",
                syncMetadata: {
                    version: 10,
                    lastModified: new Date().toISOString(),
                    deviceId: "test-device-large",
                    deviceName: "Large Data Test"
                },
                users: {
                    profiles: {}
                }
            };
            
            // Create 10 users with 50 activities each
            for (let i = 1; i <= 10; i++) {
                const userId = `user${i}`;
                largeData.users.profiles[userId] = {
                    name: `User ${i}`,
                    icon: '👤',
                    activities: [],
                    tomorrowActivities: []
                };
                
                for (let j = 1; j <= 50; j++) {
                    largeData.users.profiles[userId].activities.push({
                        id: `activity-${i}-${j}`,
                        title: `Activity ${j} for User ${i}`,
                        description: `This is a detailed description for activity ${j} that belongs to user ${i}. It contains enough text to simulate a real activity.`,
                        icon: '📝',
                        completed: Math.random() > 0.5,
                        cardType: 'recurring',
                        time: ''
                    });
                }
            }
            
            const dataSize = JSON.stringify(largeData).length;
            console.log('Generated data size:', (dataSize / 1024).toFixed(2), 'KB');
            console.log('Total users:', Object.keys(largeData.users.profiles).length);
            console.log('Total activities:', Object.values(largeData.users.profiles).reduce((sum, user) => sum + user.activities.length, 0));
            
            updateStatus(`Large dataset created: ${(dataSize / 1024).toFixed(2)} KB`, 'success');
        }
        
        function clearLocalData() {
            logOutput.textContent = '';
            updateStatus('Clearing local data...', 'info');
            
            localStorage.removeItem('stackMapData');
            localStorage.removeItem('stackMapData-demo');
            console.log('Local StackMap data cleared');
            
            updateStatus('Local data cleared', 'success');
        }
        
        function clearSyncStatus() {
            logOutput.textContent = '';
            updateStatus('Clearing sync status...', 'info');
            
            localStorage.removeItem('stackmap-last-sync-status');
            console.log('Sync status cleared');
            
            updateStatus('Sync status cleared', 'success');
        }
        
        // Initial status check
        window.onload = function() {
            console.log('=== Initial Status Check ===');
            
            const hasLocalData = localStorage.getItem('stackMapData') !== null;
            const hasAuth = localStorage.getItem('stackmap-google-token') !== null;
            const syncStatus = localStorage.getItem('stackmap-last-sync-status');
            
            console.log('Has local data:', hasLocalData);
            console.log('Has auth token:', hasAuth);
            console.log('Last sync status:', syncStatus ? JSON.parse(syncStatus) : 'None');
            
            updateStatus('Test page ready', 'info');
        };
    </script>
</body>
</html>
