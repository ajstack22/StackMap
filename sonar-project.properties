# SonarCloud Configuration for StackMap
# Organization and project identifiers
sonar.organization=ajstack22
sonar.projectKey=ajstack22_StackMap
sonar.projectName=StackMap

# Source code configuration
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Test coverage (when available)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/__tests__/**,**/node_modules/**,**/coverage/**,**/build/**,**/web/**,**/android/**,**/ios/**

# Files to exclude from analysis
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/*.test.js,**/*.spec.js,**/web/**,**/android/**,**/ios/**,**/__tests__/**,**/docs/**

# SonarCloud host
sonar.host.url=https://sonarcloud.io

# JavaScript/TypeScript specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Duplication exclusions
sonar.cpd.exclusions=**/*.test.js,**/*.spec.js,**/__tests__/**