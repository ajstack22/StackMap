<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Force Refresh - StackMap</title>
</head>
<body>
<div style="text-align:center;padding:50px;font-family:Arial,sans-serif;">
  <h1>Refreshing StackMap...</h1>
  <p>Clearing cache and redirecting to the latest version...</p>
  <div id="status"></div>
</div>

<script>
async function forceRefresh() {
  const status = document.getElementById('status');
  
  try {
    // 1. Clear service worker
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) {
        await registration.unregister();
      }
      status.innerHTML += '<p>✓ Service worker cleared</p>';
    }
    
    // 2. Clear caches
    if ('caches' in window) {
      const names = await caches.keys();
      await Promise.all(names.map(name => caches.delete(name)));
      status.innerHTML += '<p>✓ Caches cleared</p>';
    }
    
    // 3. Clear storage
    try {
      localStorage.clear();
      sessionStorage.clear();
      status.innerHTML += '<p>✓ Storage cleared</p>';
    } catch (e) {}
    
    // 4. Redirect with cache bypass
    status.innerHTML += '<p>Redirecting in 2 seconds...</p>';
    setTimeout(() => {
      // Get base path (works for both /qual/ and root)
      const basePath = window.location.pathname.replace(/force-refresh\.html.*$/, '');
      // Add timestamp to force bypass any remaining cache
      window.location.href = basePath + '?v=' + Date.now();
    }, 2000);
    
  } catch (error) {
    status.innerHTML = '<p style="color:red;">Error: ' + error.message + '</p>';
    status.innerHTML += '<p><a href="./?v=' + Date.now() + '">Click here to continue anyway</a></p>';
  }
}

// Start immediately
forceRefresh();
</script>
</body>
</html>
