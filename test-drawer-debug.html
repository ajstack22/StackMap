<!-- DORMANT-2025-01-06: Drawer testing now in UAT suite -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawer Debug Test</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <h1>Drawer Debug Test</h1>
    
    <div id="test-results"></div>
    
    <script src="config/index.js"></script>
    <script src="data/default-activities.js"></script>
    <script src="data/emoji-list.js"></script>
    <script src="data/emoji-names.js"></script>
    <script src="state.js"></script>
    <script src="components.js"></script>
    <script src="components/DraggableDrawer.js"></script>
    <script src="renderer.js"></script>
    <script src="drive-sync.js"></script>
    <script src="app/PreferencesManager.js"></script>
    <script src="app/StackMapApp.js"></script>
    
    <script>
        const results = document.getElementById('test-results');
        
        // Test 1: Check if required elements exist
        results.innerHTML += '<h2>Element Check:</h2>';
        
        const elements = [
            'staticExpansionIndicator',
            'fixedExpansionIndicator',
            'staticSubmenuContainer',
            'fixedSubmenuContainer',
            'staticLogoContainer',
            'fixedLogoContainer'
        ];
        
        elements.forEach(id => {
            const element = document.getElementById(id);
            results.innerHTML += `<p>${id}: ${element ? 'FOUND' : 'NOT FOUND'}</p>`;
        });
        
        // Test 2: Check header structure
        results.innerHTML += '<h2>Header Structure:</h2>';
        
        const staticHeader = document.querySelector('.static-header');
        const fixedHeader = document.querySelector('.fixed-header');
        
        results.innerHTML += `<p>Static Header: ${staticHeader ? 'FOUND' : 'NOT FOUND'}</p>`;
        results.innerHTML += `<p>Fixed Header: ${fixedHeader ? 'FOUND' : 'NOT FOUND'}</p>`;
        
        // Test 3: Try to initialize drawer manually
        results.innerHTML += '<h2>Manual Drawer Init:</h2>';
        
        try {
            const testDrawer = new DraggableDrawer('static-header', false);
            results.innerHTML += '<p>Drawer created successfully</p>';
        } catch (e) {
            results.innerHTML += `<p>Error creating drawer: ${e.message}</p>`;
        }
        
        // Test 4: Check ComponentBuilder
        results.innerHTML += '<h2>Component Builder:</h2>';
        results.innerHTML += `<p>createStackMapLogo exists: ${typeof ComponentBuilder.createStackMapLogo === 'function' ? 'YES' : 'NO'}</p>`;
        
        // Test 5: Try to create logo
        if (typeof ComponentBuilder.createStackMapLogo === 'function') {
            try {
                const logo = ComponentBuilder.createStackMapLogo();
                results.innerHTML += '<p>Logo created successfully</p>';
                results.appendChild(logo);
            } catch (e) {
                results.innerHTML += `<p>Error creating logo: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
