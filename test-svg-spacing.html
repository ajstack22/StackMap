<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Spacing Test</title>
    <style>
        body {
            background: #667eea;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        
        .test-container {
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .test-logo {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 2px;
            background: rgba(255,0,0,0.2);
            outline: 1px solid red;
        }
        
        .test-logo svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .test-text {
            font-size: 2rem;
            color: white;
            background: rgba(0,255,0,0.2);
            outline: 1px solid green;
        }
        
        /* Test without circle */
        .no-circle circle {
            display: none;
        }
        
        /* Test with different viewBox */
        .tight-viewbox svg {
            /* Will modify in SVG */
        }
    </style>
</head>
<body>
    <h2 style="color: white;">SVG Spacing Tests</h2>
    
    <h3 style="color: white;">1. Original SVG with circle:</h3>
    <div class="test-container">
        <div class="test-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
                <rect x="7" y="10" width="18" height="2.5" fill="#667eea" rx="1.25"/>
                <rect x="7" y="14.5" width="18" height="2.5" fill="#667eea" rx="1.25"/>
                <rect x="7" y="19" width="18" height="5" fill="#5a5cb8" rx="2.5"/>
            </svg>
        </div>
        <div class="test-text">StackMap</div>
    </div>
    
    <h3 style="color: white;">2. SVG without circle:</h3>
    <div class="test-container">
        <div class="test-logo no-circle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
                <rect x="7" y="10" width="18" height="2.5" fill="white" rx="1.25"/>
                <rect x="7" y="14.5" width="18" height="2.5" fill="white" rx="1.25"/>
                <rect x="7" y="19" width="18" height="5" fill="white" rx="2.5"/>
            </svg>
        </div>
        <div class="test-text">StackMap</div>
    </div>
    
    <h3 style="color: white;">3. SVG with tighter viewBox (6 6 20 20):</h3>
    <div class="test-container">
        <div class="test-logo tight-viewbox">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="6 9 20 17">
                <rect x="7" y="10" width="18" height="2.5" fill="white" rx="1.25"/>
                <rect x="7" y="14.5" width="18" height="2.5" fill="white" rx="1.25"/>
                <rect x="7" y="19" width="18" height="5" fill="white" rx="2.5"/>
            </svg>
        </div>
        <div class="test-text">StackMap</div>
    </div>
    
    <h3 style="color: white;">4. Just a colored div (no SVG):</h3>
    <div class="test-container">
        <div class="test-logo">
            <div style="width: 100%; height: 100%; background: white; border-radius: 50%;"></div>
        </div>
        <div class="test-text">StackMap</div>
    </div>
    
    <script>
        document.querySelectorAll('.test-container').forEach((container, index) => {
            const logo = container.querySelector('.test-logo');
            const text = container.querySelector('.test-text');
            
            const logoRect = logo.getBoundingClientRect();
            const textRect = text.getBoundingClientRect();
            
            const gap = textRect.left - logoRect.right;
            
            console.log(`Test ${index + 1}: Gap = ${gap}px`);
        });
    </script>
</body>
</html>
